name: PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Build fip-reconciler image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: fip-reconciler
          file: fip-reconciler/Containerfile
          platforms: linux/amd64
          push: false

  lint-chart:
    name: Lint Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint
        run: |
          helm lint charts/kubernetes-switchcloud/ \
            --set '_namespace.etcd=etcd-test' \
            --set '_namespace.ingress=nginx' \
            --set '_namespace.host=tenant.example.com' \
            --set 'openstack.authURL=https://example.com/v3' \
            --set 'openstack.regionName=zhw' \
            --set 'openstack.applicationCredentialID=test' \
            --set 'openstack.applicationCredentialSecret=test' \
            --set 'openstack.network.id=80dcf0aa-0000' \
            --set 'openstack.floatingIPNetwork=public'

  build-go:
    name: Go build & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: fip-reconciler/go.mod
          cache-dependency-path: fip-reconciler/go.sum

      - name: Build
        working-directory: fip-reconciler
        run: go build ./...

      - name: Vet
        working-directory: fip-reconciler
        run: go vet ./...
