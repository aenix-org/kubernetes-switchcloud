name: PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-chart:
    name: Lint Helm charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint kubernetes-switchcloud
        run: |
          helm lint charts/kubernetes-switchcloud/ \
            --set '_namespace.etcd=etcd-test' \
            --set '_namespace.ingress=nginx' \
            --set '_namespace.host=tenant.example.com' \
            --set 'openstack.authURL=https://example.com/v3' \
            --set 'openstack.regionName=zhw' \
            --set 'openstack.applicationCredentialID=test' \
            --set 'openstack.applicationCredentialSecret=test' \
            --set 'openstack.network.id=80dcf0aa-0000'

      - name: Lint provider-id-setter
        run: helm lint charts/provider-id-setter/

      - name: Lint talos-edge-router
        run: helm lint charts/talos-edge-router/

      - name: Lint talos-csr-signer
        run: |
          helm lint charts/talos-csr-signer/ \
            --set 'clusterHostname=test.example.com' \
            --set 'talosBundleSecret=test-bundle'

      - name: Lint capi-bootstrap-talos
        run: helm lint charts/capi-bootstrap-talos/

      - name: Lint capi-infraprovider-openstack
        run: helm lint charts/capi-infraprovider-openstack/

      - name: Lint platform chart
        run: helm lint packages/core/platform/
