name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  push-provider-id-setter:
    name: Build and push provider-id-setter image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          SHA="${GITHUB_SHA::8}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "tags=ghcr.io/aenix-org/provider-id-setter:${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/aenix-org/provider-id-setter:${SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: provider-id-setter
          file: provider-id-setter/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push-talos-csr-signer:
