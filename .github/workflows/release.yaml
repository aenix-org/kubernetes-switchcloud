          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push-charts:
    name: Package and push Helm charts to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Package charts
        run: |
          for dir in charts/*/; do
            helm package "$dir" --destination _dist/
          done
          helm package packages/core/platform/ --destination _dist/

      - name: Push charts
        run: |
          for tgz in _dist/*.tgz; do
            helm push "$tgz" oci://ghcr.io/aenix-org
          done
