name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  push-image:
    name: Build and push fip-reconciler image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          SHA="${GITHUB_SHA::8}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "tags=999669/fip-reconciler:${VERSION},999669/fip-reconciler:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=999669/fip-reconciler:${SHA},999669/fip-reconciler:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: fip-reconciler
          file: fip-reconciler/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push-chart:
    name: Package and push Helm chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to Docker Hub (OCI)
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
            helm registry login registry-1.docker.io \
              --username "${{ secrets.DOCKERHUB_USERNAME }}" \
              --password-stdin

      - name: Package charts
        run: |
          helm package charts/kubernetes-switchcloud/ --destination _dist/
          helm package charts/provider-id-setter/ --destination _dist/

      - name: Push charts
        run: |
          helm push _dist/kubernetes-switchcloud-*.tgz oci://registry-1.docker.io/999669
          helm push _dist/provider-id-setter-*.tgz oci://registry-1.docker.io/999669
