name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  push-fip-reconciler:
    name: Build and push fip-reconciler image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          SHA="${GITHUB_SHA::8}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "tags=999669/fip-reconciler:${VERSION},999669/fip-reconciler:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=999669/fip-reconciler:${SHA},999669/fip-reconciler:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: fip-reconciler
          file: fip-reconciler/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push-provider-id-setter:
    name: Build and push provider-id-setter image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          SHA="${GITHUB_SHA::8}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "tags=999669/provider-id-setter:${VERSION},999669/provider-id-setter:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=999669/provider-id-setter:${SHA},999669/provider-id-setter:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: provider-id-setter
          file: provider-id-setter/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push-charts:
    name: Package and push Helm charts to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Package charts
        run: |
          for dir in charts/*/; do
            helm package "$dir" --destination _dist/
          done
          helm package packages/core/platform/ --destination _dist/

      - name: Push charts
        run: |
          for tgz in _dist/*.tgz; do
            helm push "$tgz" oci://ghcr.io/aenix-org
          done
