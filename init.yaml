---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kubernetes-switchcloud-platform
  namespace: cozy-system
spec:
  interval: 5m
  url: oci://ghcr.io/aenix-org/kubernetes-switchcloud-platform-packages
  ref:
    # Match pre-release tags too (e.g. "0.0.8-sha-<short>"): per semver,
    # constraints without a pre-release suffix do not include pre-release
    # versions, so ">=0.0.0" alone leaves the OCIRepository stuck on
    # "no match found" until a stable tag is cut. Including "-0" widens
    # the constraint to all valid semver versions.
    semver: ">=0.0.0-0"
---
apiVersion: cozystack.io/v1alpha1
kind: PackageSource
metadata:
  name: cozystack.kubernetes-switchcloud-platform
  namespace: cozy-system
spec:
  sourceRef:
    kind: OCIRepository
    name: kubernetes-switchcloud-platform
    namespace: cozy-system
    path: /
  variants:
  - name: default
    components:
    - name: kubernetes-switchcloud-platform
      path: core/platform
      install:
        namespace: cozy-kubernetes-switchcloud
        releaseName: kubernetes-switchcloud-platform
---
apiVersion: cozystack.io/v1alpha1
kind: Package
metadata:
  name: cozystack.kubernetes-switchcloud-platform
  namespace: cozy-system
spec:
  variant: default
