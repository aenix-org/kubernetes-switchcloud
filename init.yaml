---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: OCIRepository
metadata:
  name: kubernetes-switchcloud-platform
  namespace: cozy-public
spec:
  interval: 5m
  url: oci://ghcr.io/aenix-org/kubernetes-switchcloud-platform
  ref:
    semver: ">=0.0.1"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubernetes-switchcloud
  namespace: cozy-system
spec:
  interval: 5m
  targetNamespace: cozy-system
  chartRef:
    kind: OCIRepository
    name: kubernetes-switchcloud-platform
    namespace: cozy-public
