---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kubernetes-switchcloud
  namespace: cozy-public
spec:
  type: oci
  # Charts live under /charts/ to avoid colliding with container
  # image tags at the same OCI path. The push side (release.yaml)
  # writes here; keep both in sync.
  url: oci://ghcr.io/aenix-org/charts
  interval: 5m
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmChart
metadata:
  name: kubernetes-switchcloud-capi-bootstrap-talos
  namespace: cozy-public
spec:
  chart: cozy-capi-bootstrap-talos
  version: ">=0.0.0-0"
  sourceRef:
    kind: HelmRepository
    name: kubernetes-switchcloud
    namespace: cozy-public
  interval: 5m
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmChart
metadata:
  name: kubernetes-switchcloud-capi-infraprovider-openstack
  namespace: cozy-public
spec:
  chart: cozy-capi-infraprovider-openstack
  version: ">=0.0.0-0"
  sourceRef:
    kind: HelmRepository
    name: kubernetes-switchcloud
    namespace: cozy-public
  interval: 5m
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmChart
metadata:
  name: kubernetes-switchcloud-talos-edge-router
  namespace: cozy-public
spec:
  chart: cozy-talos-edge-router
  version: ">=0.0.0-0"
  sourceRef:
    kind: HelmRepository
    name: kubernetes-switchcloud
    namespace: cozy-public
  interval: 5m
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmChart
metadata:
  name: kubernetes-switchcloud-kilo-clustermesh-operator
  namespace: cozy-public
spec:
  chart: cozy-kilo-clustermesh-operator
  version: ">=0.0.0-0"
  sourceRef:
    kind: HelmRepository
    name: kubernetes-switchcloud
    namespace: cozy-public
  interval: 5m
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmChart
metadata:
  name: kubernetes-switchcloud-loadbalancer-controller
  namespace: cozy-public
spec:
  chart: cozy-loadbalancer-controller
  # The chart ships with a 0.0.0 placeholder version that the build
  # stamps to the repository release version (see the `repo` target in
  # packages/system/Makefile). `>=0.0.0-0` therefore matches whatever
  # version was built and published to oci://ghcr.io/aenix-org/charts.
  # Charts live under /charts/ so they no longer share an OCI tag
  # namespace with the loadbalancer-controller container image.
  version: ">=0.0.0-0"
  sourceRef:
    kind: HelmRepository
    name: kubernetes-switchcloud
    namespace: cozy-public
  interval: 5m
