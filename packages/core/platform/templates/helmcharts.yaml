---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: kubernetes-switchcloud
  namespace: cozy-public
spec:
  type: oci
  url: oci://ghcr.io/aenix-org
  interval: 5m
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmChart
metadata:
  name: kubernetes-switchcloud-capi-bootstrap-talos
  namespace: cozy-public
spec:
  chart: capi-bootstrap-talos
  version: "0.1.x"
  sourceRef:
    kind: HelmRepository
    name: kubernetes-switchcloud
    namespace: cozy-public
  interval: 5m
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmChart
metadata:
  name: kubernetes-switchcloud-capi-infraprovider-openstack
  namespace: cozy-public
spec:
  chart: capi-infraprovider-openstack
  version: "0.1.x"
  sourceRef:
    kind: HelmRepository
    name: kubernetes-switchcloud
    namespace: cozy-public
  interval: 5m
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmChart
metadata:
  name: kubernetes-switchcloud-talos-edge-router
  namespace: cozy-public
spec:
  chart: talos-edge-router
  version: "0.3.x"
  sourceRef:
    kind: HelmRepository
    name: kubernetes-switchcloud
    namespace: cozy-public
  interval: 5m
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmChart
metadata:
  name: kubernetes-switchcloud-loadbalancer-controller
  namespace: cozy-public
spec:
  chart: loadbalancer-controller
  # Pinned to 0.8.x: CI publishes the controller image at the
  # git-tag value (e.g. v0.9.0 -> ghcr.io/aenix-org/loadbalancer-controller:0.9.0),
  # and Helm charts share the same OCI repo path. An unconstrained
  # `0.x` would pick the highest semver in the namespace, which can
  # be a container-image tag (not a chart) and fail on mediatype.
  # Keep this in sync with charts/loadbalancer-controller/Chart.yaml
  # `version`.
  version: "0.8.x"
  sourceRef:
    kind: HelmRepository
    name: kubernetes-switchcloud
    namespace: cozy-public
  interval: 5m
