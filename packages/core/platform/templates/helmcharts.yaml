---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: kubernetes-switchcloud
  namespace: cozy-public
spec:
  type: oci
  # Charts live under /charts/ to avoid colliding with container
  # image tags at the same OCI path. The push side (release.yaml)
  # writes here; keep both in sync.
  url: oci://ghcr.io/aenix-org/charts
  interval: 5m
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmChart
metadata:
  name: kubernetes-switchcloud-capi-bootstrap-talos
  namespace: cozy-public
spec:
  chart: capi-bootstrap-talos
  version: "0.1.x"
  sourceRef:
    kind: HelmRepository
    name: kubernetes-switchcloud
    namespace: cozy-public
  interval: 5m
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmChart
metadata:
  name: kubernetes-switchcloud-capi-infraprovider-openstack
  namespace: cozy-public
spec:
  chart: capi-infraprovider-openstack
  version: "0.1.x"
  sourceRef:
    kind: HelmRepository
    name: kubernetes-switchcloud
    namespace: cozy-public
  interval: 5m
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmChart
metadata:
  name: kubernetes-switchcloud-talos-edge-router
  namespace: cozy-public
spec:
  chart: talos-edge-router
  version: "0.3.x"
  sourceRef:
    kind: HelmRepository
    name: kubernetes-switchcloud
    namespace: cozy-public
  interval: 5m
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmChart
metadata:
  name: kubernetes-switchcloud-loadbalancer-controller
  namespace: cozy-public
spec:
  chart: loadbalancer-controller
  # Pinned to 0.10.x: CI publishes the controller image at the
  # git-tag value (e.g. v0.10.0 -> ghcr.io/aenix-org/loadbalancer-controller:0.10.0),
  # and Helm charts share the same OCI repo path. An unconstrained
  # `0.x` would pick the highest semver in the namespace, which can
  # be a container-image tag (not a chart) and fail on mediatype.
  # Keep this in sync with charts/loadbalancer-controller/Chart.yaml
  # `version` — bump the constraint major/minor whenever the chart
  # crosses that boundary.
  version: "0.10.x"
  sourceRef:
    kind: HelmRepository
    name: kubernetes-switchcloud
    namespace: cozy-public
  interval: 5m
