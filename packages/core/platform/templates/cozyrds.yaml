apiVersion: cozystack.io/v1alpha1
kind: ApplicationDefinition
metadata:
  name: kubernetes-switchcloud
  annotations:
    release.cozystack.io/helm-install-timeout: "15m"
spec:
  application:
    kind: KubernetesSwitchcloud
    singular: kubernetesswitchcloud
    plural: kubernetesswitchclouds
    openAPISchema: |-
      {"title":"Chart Values","type":"object","properties":{"openstack":{"description":"OpenStack connection settings.","type":"object","default":{},"properties":{"authURL":{"description":"OpenStack identity endpoint.","type":"string","default":""},"regionName":{"description":"OpenStack region name.","type":"string","default":""},"applicationCredentialID":{"description":"Application credential ID.","type":"string","default":""},"applicationCredentialSecret":{"description":"Application credential secret.","type":"string","default":""},"cloudName":{"description":"Cloud name used as key in clouds.yaml.","type":"string","default":"openstack"},"existingSecret":{"description":"Name of existing Secret with clouds.yaml (overrides inline credentials).","type":"string","default":""},"floatingIPNetwork":{"description":"External network for Floating IPs (leave empty to disable FIPs).","type":"string","default":""},"loadBalancer":{"description":"Centralised LoadBalancer feature. When enabled, the management-cluster loadbalancer-controller provisions Octavia LBs for tenant Services of type LoadBalancer using the OpenStack credentials configured above; tenant cluster users never see those credentials directly.","type":"object","default":{},"properties":{"enabled":{"description":"Enable centralised LoadBalancer provisioning for this tenant. Off by default; turn on only after the controller has been deployed to the management cluster.","type":"boolean","default":false},"providerDriver":{"description":"Octavia provider driver. In Switch Cloud zhw only `ovn` is functional (the `amphora` driver has no flavors). Leave empty to use the project default.","type":"string","default":"ovn"},"vipNetworkID":{"description":"REQUIRED when enabled=true. Neutron network ID where the LB VIP port is allocated. Must be a tenant-owned network reachable from the worker nodes (typically the same network as spec.openstack.network.id). In Switch Cloud zhw direct-on-public VIP is not BGP-announced for IPv4, so VIP must live on a tenant network and external access is wired via floatingNetworkID below.","type":"string","default":""},"floatingNetworkID":{"description":"Optional external network ID. When set, the controller allocates a floating IP from this network after the LB becomes ACTIVE and binds it to the LB VIP port; the FIP address is reported back in Service.status.loadBalancer.ingress. Leave empty for internal-only LBs (no external reachability).","type":"string","default":""},"floatingSubnetID":{"description":"Optional Neutron subnet ID within floatingNetworkID. Pins FIP allocation to a specific subnet when the external network has multiple subnets (e.g. dual-stack). Leave empty to let Neutron pick.","type":"string","default":""}}},"network":{"description":"OpenStack network settings.","type":"object","default":{},"properties":{"id":{"description":"OpenStack network ID for worker nodes.","type":"string","default":""}}}}},"version":{"description":"Kubernetes version string (e.g. v1.32.6).","type":"string","default":"v1.32.6"},"talosVersion":{"description":"Talos OS version embedded in the node image.","type":"string","default":"v1.10.0"},"controlPlane":{"description":"Kamaji control-plane configuration.","type":"object","default":{},"properties":{"replicas":{"description":"Number of control-plane replicas.","type":"integer","default":2}}},"host":{"description":"External hostname for the Kubernetes API. Defaults to <name>.<namespace>.svc:6443 when empty.","type":"string","default":""},"ingressClassName":{"description":"IngressClass for the Kamaji-managed apiserver Ingress. When empty (default), falls back to `_namespace.ingress` (= the parent tenant namespace name) so per-tenant Ingress controllers like `tenant-root` keep working unchanged. Set to e.g. `nginx` to route the apiserver through a host-level ingress controller instead (saves provisioning a dedicated tenant-root ingress-nginx for clusters that already expose one at the platform level; the controller must have --enable-ssl-passthrough since the Kamaji apiserver terminates TLS itself).","type":"string","default":""},"nodeGroups":{"description":"Worker node group definitions.","type":"object","default":{"md0":{"minReplicas":0,"maxReplicas":10,"flavorName":"c004r008","imageName":"talos-openstack-amd64","roles":[],"resources":{"cpu":4,"memory":"8Gi"},"kubelet":{"evictionHardMemory":"7%","evictionSoftMemory":"10%"},"securityGroups":["default"]}},"additionalProperties":{"type":"object","required":["flavorName","imageName","maxReplicas","minReplicas"],"properties":{"minReplicas":{"description":"Minimum autoscaler replicas.","type":"integer","default":0},"maxReplicas":{"description":"Maximum autoscaler replicas.","type":"integer","default":10},"flavorName":{"description":"OpenStack Nova flavor name.","type":"string","default":"c004r008"},"imageName":{"description":"Glance image name for Talos nodes.","type":"string","default":"talos-openstack-amd64"},"roles":{"description":"Node roles propagated as labels.","type":"array","items":{"type":"string"}},"resources":{"description":"CPU/memory for kubelet reservations and autoscaler capacity hints.","type":"object","properties":{"cpu":{"anyOf":[{"type":"integer"},{"type":"string"}],"x-kubernetes-int-or-string":true},"memory":{"anyOf":[{"type":"integer"},{"type":"string"}],"x-kubernetes-int-or-string":true}}},"kubelet":{"description":"Kubelet eviction threshold overrides.","type":"object","properties":{"evictionHardMemory":{"type":"string","default":"7%"},"evictionSoftMemory":{"type":"string","default":"10%"}}},"securityGroups":{"description":"OpenStack security groups.","type":"array","items":{"type":"string"}}}}},"addons":{"description":"Cluster addons configuration.","type":"object","default":{},"properties":{"certManager":{"type":"object","default":{},"properties":{"enabled":{"type":"boolean","default":true},"valuesOverride":{"type":"object","default":{},"x-kubernetes-preserve-unknown-fields":true}}},"cilium":{"type":"object","default":{},"properties":{"valuesOverride":{"type":"object","default":{},"x-kubernetes-preserve-unknown-fields":true}}},"ingressNginx":{"type":"object","default":{},"properties":{"enabled":{"type":"boolean","default":false,"description":"Enable Ingress-NGINX controller in the tenant cluster."},"exposeMethod":{"type":"string","enum":["LoadBalancer","Proxied"],"default":"LoadBalancer","description":"How the controller is reachable from outside. Proxied is reserved for a future platform-side router and currently fails render in switchcloud."},"hosts":{"type":"array","default":[],"items":{"type":"string"},"description":"Domains served by this tenant ingress. Used for cert-manager SANs and to document the public routing target."},"valuesOverride":{"type":"object","default":{},"x-kubernetes-preserve-unknown-fields":true}}},"metricsServer":{"type":"object","default":{},"properties":{"enabled":{"type":"boolean","default":true},"valuesOverride":{"type":"object","default":{},"x-kubernetes-preserve-unknown-fields":true}}},"fluxcd":{"type":"object","default":{},"properties":{"enabled":{"type":"boolean","default":false},"valuesOverride":{"type":"object","default":{},"x-kubernetes-preserve-unknown-fields":true}}},"kilo":{"type":"object","default":{},"properties":{"enabled":{"type":"boolean","default":false,"description":"Install Kilo WireGuard mesh in the tenant cluster. Required for cross-location routing or kilo-clustermesh-operator participation."},"valuesOverride":{"type":"object","default":{},"x-kubernetes-preserve-unknown-fields":true},"clusterMesh":{"type":"object","default":{},"description":"When remoteClusters is non-empty, emits a ClusterMesh CR for kilo-clustermesh-operator. The local cluster entry is auto-derived; for each remote tenant supply its name and the Kamaji admin-kubeconfig Secret name.","properties":{"localWireguardCIDR":{"type":"string","default":"","description":"WireGuard CIDR for the local cluster; must match the kilo.transitCIDR you set under addons.kilo.valuesOverride."},"wireguardPort":{"type":"integer","default":51820,"description":"UDP port for WireGuard peers."},"remoteClusters":{"type":"array","default":[],"description":"Remote clusters to mesh with. Empty list disables ClusterMesh emission.","items":{"type":"object","required":["name","kubeconfigSecretName","podCIDRs","serviceCIDR","wireguardCIDR"],"properties":{"name":{"type":"string"},"kubeconfigSecretName":{"type":"string","description":"Name of the Secret in tenant-root holding the remote cluster admin kubeconfig (Kamaji default: <release>-admin-kubeconfig)."},"kubeconfigSecretKey":{"type":"string","default":"super-admin.conf"},"podCIDRs":{"type":"array","items":{"type":"string"}},"serviceCIDR":{"type":"string"},"wireguardCIDR":{"type":"string"},"wireguardPort":{"type":"integer","default":51820}}}}}}}}}},"network":{"type":"object","default":{},"description":"Cluster network CIDRs. Immutable after cluster creation.","properties":{"podCIDR":{"type":"string","default":"10.243.0.0/16","description":"CIDR allocated for pods. Maps onto CAPI Cluster.spec.clusterNetwork.pods.cidrBlocks."},"serviceCIDR":{"type":"string","default":"10.95.0.0/16","description":"CIDR allocated for Services. Maps onto CAPI Cluster.spec.clusterNetwork.services.cidrBlocks."},"dnsClusterIP":{"type":"string","default":"10.95.0.10","description":"ClusterIP for the CoreDNS Service. Must fall inside serviceCIDR."}}}}}
  release:
    prefix: kubernetes-switchcloud-
    labels:
      sharding.fluxcd.io/key: tenants
    chartRef:
      kind: ExternalArtifact
      name: kubernetes-switchcloud-default-kubernetes-switchcloud
      namespace: cozy-system
  dashboard:
    category: IaaS
    singular: Kubernetes (Switch Cloud)
    plural: Kubernetes (Switch Cloud)
    weight: 41
    description: Managed Kubernetes service on Switch Cloud (OpenStack + Talos)
    tags:
      - compute
      - openstack
  secrets:
    exclude: []
    include:
      - resourceNames:
          - kubernetes-switchcloud-{{"{{"}} .name {{"}}"}}-admin-kubeconfig
  services:
    exclude: []
    include:
      - resourceNames:
          - kubernetes-switchcloud-{{"{{"}} .name {{"}}"}}
      - matchLabels:
          cluster.x-k8s.io/cluster-name: kubernetes-switchcloud-{{"{{"}} .name {{"}}"}}
  ingresses:
    exclude: []
    include:
      - resourceNames:
          - kubernetes-switchcloud-{{"{{"}} .name {{"}}"}}
