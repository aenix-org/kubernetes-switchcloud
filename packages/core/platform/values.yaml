## @section Talos edge router
## Pass-through to the talos-edge-router chart (packages/system/talos-edge-router).
## Use to switch the Service from ClusterIP + ipsync-managed externalIPs to a
## LoadBalancer Service whose public IP is owned by an external LB controller
## (MetalLB IP-sharing with ingress-nginx is the driving case).
##
## Default leaves the router in ClusterIP mode so existing deployments behave
## unchanged.
##
## Example for MetalLB IP-sharing with ingress-nginx on the same public IP:
##
##   talosEdgeRouter:
##     service:
##       type: LoadBalancer
##       loadBalancerIP: "203.0.113.10"
##       annotations:
##         metallb.universe.tf/allow-shared-ip: "talos-shared"
talosEdgeRouter:
  service:
    type: ClusterIP
    loadBalancerIP: ""
    annotations: {}

## @section Kilo ClusterMesh operator
## Pass-through to the kilo-clustermesh-operator chart
## (packages/system/kilo-clustermesh-operator). Reconciles ClusterMesh
## (kilo.squat.ai/v1alpha1) resources emitted by KubernetesSwitchcloud
## tenants into cross-cluster WireGuard Peer objects.
##
## Empty by default so the operator runs with its own chart defaults.
## Override to tune image, replicas, resources, leader election, etc.:
##
##   kiloClustermeshOperator:
##     replicaCount: 1
##     resources:
##       requests:
##         cpu: 10m
##         memory: 64Mi
kiloClustermeshOperator: {}
