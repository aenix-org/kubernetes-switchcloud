openstack:
  authURL: "https://identity.api.zhw.cloud.switch.ch/v3"
  regionName: "zhw"
  applicationCredentialID: "<your-app-cred-id>"
  applicationCredentialSecret: "<your-app-cred-secret>"
  network:
    id: "80dcf0aa-9525-4a4f-b5ec-91e3d4cfd0ce"
  # floatingIPNetwork enables automatic Floating IP allocation per worker node.
  # Required for internet access and Kilo WireGuard mesh.
  floatingIPNetwork: "public"

version: "v1.32.6"
talosVersion: "v1.10.0"

controlPlane:
  replicas: 2

nodeGroups:
  md0:
    minReplicas: 0
    maxReplicas: 5
    flavorName: "c004r008"
    imageName: "talos-openstack-amd64"
    resources:
      cpu: 4
      memory: 8Gi

addons:
  certManager:
    enabled: true
  cilium:
    enabled: true
  ingressNginx:
    enabled: false
  metricsServer:
    enabled: true
  kilo:
    enabled: true
    clusterMesh:
      # WireGuard CIDR for this cluster. Joined with network.podCIDR and
      # network.serviceCIDR into this cluster's allowedNetworks entry.
      localWireguardCIDR: "10.4.0.0/16"
      wireguardPort: 51820
      remoteClusters:
        # Example: mesh with an external Ceph cluster so tenant workloads
        # can reach its mons/OSDs. allowedNetworks is the flat union of every
        # CIDR reachable through that peer (kilo-clustermesh-operator 0.6.0).
        - name: ceph
          kubeconfigSecretName: ceph-admin-kubeconfig
          kubeconfigSecretKey: super-admin.conf
          allowedNetworks:
            - "10.10.0.0/16"   # ceph pod CIDR
            - "10.20.0.0/16"   # ceph service CIDR
            - "10.5.0.0/16"    # ceph WireGuard CIDR
            - "192.168.100.0/24" # ceph public storage network
          wireguardPort: 51820

_namespace:
  etcd: "etcd-tenant-root"
  ingress: "nginx"
  host: "tenant.cozy3.example.com"
