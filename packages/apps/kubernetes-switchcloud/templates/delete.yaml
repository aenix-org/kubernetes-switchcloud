---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
  name: {{ .Release.Name }}-pre-cleanup
spec:
  template:
    metadata:
      labels:
        policy.cozystack.io/allow-to-apiserver: "true"
    spec:
      serviceAccountName: {{ .Release.Name }}-cleanup
      restartPolicy: Never
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: "NoSchedule"
      containers:
        - name: kubectl
          image: docker.io/clastix/kubectl:v1.32
          command:
            - /bin/sh
            - -c
            - |
              set -e
              SEL="cozystack.io/target-cluster-name={{ .Release.Name }}"
              NS={{ .Release.Namespace }}

              # Step 1: kick off child HelmRelease deletions while the
              # tenant kube-apiserver is still reachable. --wait=false is
              # fine here because we manage the wait window ourselves.
              echo "Step 1: Deleting HelmReleases targeting cluster {{ .Release.Name }}"
              kubectl -n "$NS" delete helmreleases.helm.toolkit.fluxcd.io \
                -l "$SEL" --ignore-not-found=true --wait=false

              # Step 2: wait for helm-controller to finish 'helm uninstall'
              # inside the tenant. On success the HR releases its finalizer
              # and disappears. If we hit the grace deadline, force-clear
              # the Flux finalizer so Step 3 (Kamaji teardown) does not
              # strand any HR with an unreachable kubeConfig — production
              # symptom:
              #   Get https://<tenant>.<ns>.svc:6443/version: no such host
              # which happened when Kamaji was torn down before the child
              # HR uninstalls could even talk to the tenant apiserver, and
              # the Flux finalizer never released.
              GRACE=180
              echo "Step 2: waiting up to ${GRACE}s for HelmRelease uninstall"
              deadline=$(( $(date +%s) + GRACE ))
              while [ $(date +%s) -lt $deadline ]; do
                # Capture kubectl output AND exit status separately. A
                # transient apiserver hiccup (rate-limit, network blip)
                # would otherwise print nothing to stdout, `wc -l` returns
                # 0, and the script falsely concludes that every HR is
                # gone — exiting the wait loop too early and leaving
                # half-uninstalled HRs to be force-finalized. Treat a
                # failed query as "still pending" so the loop retries.
                if ! listing=$(kubectl -n "$NS" get hr -l "$SEL" --no-headers 2>/dev/null); then
                  echo "  list failed, retrying"
                  sleep 10
                  continue
                fi
                # Empty stdout means no HelmReleases match the selector.
                # Counting with `[ -z ]` avoids the grep-with-||-true
                # gymnastics that previously masked grep's exit=1.
                if [ -z "$listing" ]; then
                  echo "  all HelmReleases uninstalled cleanly"
                  break
                fi
                remaining=$(printf '%s\n' "$listing" | wc -l | tr -d ' ')
                echo "  still pending: $remaining"
                sleep 10
              done

              # Force-clear the Flux finalizer on whatever did not finish
              # in time. Tenant-cluster-resident resources die with the
              # tenant when Kamaji is torn down, but child HelmReleases
              # whose target is THIS host cluster (e.g. trustd-csr-signer
              # in tenant-root) leak: their Deployments, Services,
              # ConfigMaps, RBAC, and SAs have no owner reference back to
              # the HR object, and kubernetes garbage collection never
              # touches them. They sit as zombies until manually removed.
              #
              # After force-clearing the HR finalizer, walk every Helm
              # release the controller left behind and explicitly delete
              # everything labelled by Flux as belonging to it. The labels
              # `helm.toolkit.fluxcd.io/name` and `helm.toolkit.fluxcd.io/namespace`
              # are stamped on every rendered resource by helm-controller
              # regardless of the target namespace, so this works for
              # both host-side and tenant-side HRs.
              echo "  force-clearing Flux finalizers on remaining HelmReleases"
              for hr in $(kubectl -n "$NS" get hr -l "$SEL" --no-headers -o custom-columns=NAME:.metadata.name 2>/dev/null); do
                echo "    patching $hr"
                kubectl -n "$NS" patch hr "$hr" --type=merge \
                  -p '{"metadata":{"finalizers":[]}}' || true
                echo "    cleaning leftover host-side resources for $hr"
                FLUX_SEL="helm.toolkit.fluxcd.io/name=$hr,helm.toolkit.fluxcd.io/namespace=$NS"
                kubectl -n "$NS" delete \
                  all,configmap,serviceaccount,role,rolebinding,secret \
                  -l "$FLUX_SEL" --ignore-not-found=true --wait=false || true
                # Helm release storage secrets are not labelled with
                # the helm.toolkit.fluxcd.io selector; drop them by name
                # prefix so the next install on the same release name
                # starts from a clean slate.
                kubectl -n "$NS" delete secret \
                  $(kubectl -n "$NS" get secret -o name 2>/dev/null \
                    | grep -F "secret/sh.helm.release.v1.$hr." || true) \
                  --ignore-not-found=true || true
              done

              echo "Step 3: Deleting KamajiControlPlane {{ .Release.Name }}"
              kubectl -n "$NS" delete kamajicontrolplanes.controlplane.cluster.x-k8s.io {{ .Release.Name }} \
                --ignore-not-found=true --wait=false

              echo "Step 4: Deleting TenantControlPlane {{ .Release.Name }}"
              kubectl -n "$NS" delete tenantcontrolplanes.kamaji.clastix.io {{ .Release.Name }} \
                --ignore-not-found=true --wait=false

              echo "Cleanup completed successfully"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-cleanup
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
    helm.sh/hook-weight: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
    "helm.sh/hook-weight": "5"
  name: {{ .Release.Name }}-cleanup
rules:
  - apiGroups:
      - "helm.toolkit.fluxcd.io"
    resources:
      - helmreleases
    verbs:
      - get
      - list
      - watch
      - patch
      - delete
  - apiGroups:
      - "controlplane.cluster.x-k8s.io"
    resources:
      - kamajicontrolplanes
    verbs:
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - "kamaji.clastix.io"
    resources:
      - tenantcontrolplanes
    verbs:
      - get
      - list
      - watch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
    "helm.sh/hook-weight": "5"
  name: {{ .Release.Name }}-cleanup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-cleanup
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-cleanup
    namespace: {{ .Release.Namespace }}
