{{- $localCluster := .Values.addons.kilo.clusterMesh.localCluster | default dict }}
{{- $hasRemote := .Values.addons.kilo.clusterMesh.remoteClusters }}
{{- $hasLocalCluster := $localCluster.name }}
{{- if and .Values.addons.kilo.enabled (or $hasRemote $hasLocalCluster) .Values._namespace.etcd }}
{{- /*
  A ClusterMesh is symmetric: every participating KubernetesSwitchcloud CR
  lists its peers in addons.kilo.clusterMesh.remoteClusters, so the Kilo
  daemonset on each side gets the correct WireGuard wiring (encapsulate,
  nodeAnnotator) via the umbrella helmreleases/kilo.yaml template. But
  there must be exactly ONE ClusterMesh resource in the shared namespace,
  otherwise kilo-clustermesh-operator's CIDR validator flags overlapping
  meshes. Pick a deterministic owner: the cluster whose Release.Name sorts
  first among {self + all remoteClusters[*].name + localCluster.name} is
  the only one that emits the CR. Every other peer is silent here.

  kilo-clustermesh-operator 0.6.0 flattened the per-cluster CIDR fields
  (podCIDRs / serviceCIDR / wireguardCIDR / additionalCIDRs) into a single
  spec.clusters[].allowedNetworks list. Remote and management peers now
  carry that list verbatim from values; the self entry is still derived
  from this release's network.* CIDRs and the local WireGuard CIDR.
*/}}
{{- $names := list .Release.Name }}
{{- range .Values.addons.kilo.clusterMesh.remoteClusters }}
{{-   $names = append $names .name }}
{{- end }}
{{- $owner := index (sortAlpha $names) 0 }}
{{- if eq $owner .Release.Name }}
---
apiVersion: kilo.squat.ai/v1alpha1
kind: ClusterMesh
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    cozystack.io/target-cluster-name: {{ .Release.Name }}
spec:
  clusters:
    {{- /* self / this KubernetesSwitchcloud cluster: union of pod, service and WireGuard CIDRs */}}
    {{- $selfNetworks := list .Values.network.podCIDR .Values.network.serviceCIDR (required "addons.kilo.clusterMesh.localWireguardCIDR is required when clusterMesh is non-empty" .Values.addons.kilo.clusterMesh.localWireguardCIDR) }}
    - name: {{ .Release.Name }}
      kubeconfigSecretRef:
        name: {{ .Release.Name }}-admin-kubeconfig
        key: super-admin.conf
      allowedNetworks:
      {{- range $selfNetworks }}
        - {{ . | quote }}
      {{- end }}
      wireguardPort: {{ .Values.addons.kilo.clusterMesh.wireguardPort | default 51820 }}
    {{- range .Values.addons.kilo.clusterMesh.remoteClusters }}
    - name: {{ .name }}
      kubeconfigSecretRef:
        name: {{ .kubeconfigSecretName }}
        key: {{ .kubeconfigSecretKey | default "super-admin.conf" }}
      allowedNetworks:
      {{- range (required (printf "addons.kilo.clusterMesh.remoteClusters[%s].allowedNetworks is required" .name) .allowedNetworks) }}
        - {{ . | quote }}
      {{- end }}
      wireguardPort: {{ .wireguardPort | default $.Values.addons.kilo.clusterMesh.wireguardPort | default 51820 }}
      {{- with .persistentKeepalive }}
      persistentKeepalive: {{ . }}
      {{- end }}
    {{- end }}
    {{- if $hasLocalCluster }}
    - name: {{ $localCluster.name }}
      local: true
      allowedNetworks:
      {{- range (required "addons.kilo.clusterMesh.localCluster.allowedNetworks is required when localCluster is set" $localCluster.allowedNetworks) }}
        - {{ . | quote }}
      {{- end }}
      wireguardPort: {{ $localCluster.wireguardPort | default $.Values.addons.kilo.clusterMesh.wireguardPort | default 51820 }}
      {{- with $localCluster.persistentKeepalive }}
      persistentKeepalive: {{ . }}
      {{- end }}
    {{- end }}
{{- end }}
{{- end }}
