{{/*
TalosConfigTemplate spec fragment used for hash-based immutability.
Must be defined at file scope (not inside range).
Context must include: systemReservedMemory, kubeReservedMemory, systemReservedCpu,
kubeReservedCpu, evictionHardMemory, evictionSoftMemory (plus the standard $ root).
*/}}
{{- define "talosconfigtemplate" -}}
generateType: worker
talosVersion: {{ $.Values.talosVersion }}
configPatches:
  # Pin kubelet node IP to the OpenStack subnet so it always selects eth0
  # and never latches onto the Kilo WireGuard overlay (kilo0). Without this,
  # once Kilo brings up kilo0, a kubelet restart picks kilo0's IP as
  # InternalIP because it wins the interface enumeration order, causing
  # --internal-cidr=$(NODE_IP)/32 to resolve to the WireGuard subnet and
  # crashing subsequent Kilo restarts with "no valid IP was found".
  {{- if and $.Values.openstack.network.subnetCIDR (not $.Values.openstack.network.id) }}
  - op: add
    path: /machine/kubelet/nodeIP
    value:
      validSubnets:
        - {{ $.Values.openstack.network.subnetCIDR }}
  {{- end }}
  - op: add
    path: /machine/kubelet/extraArgs
    value:
      system-reserved: "memory={{ .systemReservedMemory }},cpu={{ .systemReservedCpu }}"
      kube-reserved: "memory={{ .kubeReservedMemory }},cpu={{ .kubeReservedCpu }}"
      eviction-hard: "memory.available<{{ .evictionHardMemory }},nodefs.available<10%"
      eviction-soft: "memory.available<{{ .evictionSoftMemory }},nodefs.available<15%"
      eviction-soft-grace-period: "memory.available=1m30s,nodefs.available=1m30s"
      enforce-node-allocatable: "pods"
  # KubePrism intentionally disabled: kubelet would dial https://127.0.0.1:7445
  # and the upstream nginx ingress (SSL passthrough) cannot select a backend
  # by SNI=127.0.0.1, so it returns its default "ingress.local" fake cert and
  # the kubelet TLS handshake fails. With KubePrism off, kubelet goes straight
  # to cluster.controlPlane.endpoint and the public hostname matches both
  # the ingress and the apiserver cert SANs. Pod-network access to the
  # workload apiserver is handled separately by tenant-apiserver-proxy.
  - op: replace
    path: /machine/features/kubePrism/enabled
    value: false
  - op: replace
    path: /machine/features/hostDNS/forwardKubeDNSToHost
    value: false
  - op: add
    path: /machine/kernel
    value:
      modules:
        - name: spl
        - name: zfs
  # Shorten TCP keepalive idle so middleboxes (Switch Cloud NAT, dev3 Cilium
  # conntrack) don't evict long-lived TCP from konnectivity-agent. Defaults
  # are 7200s/75s/9, which is too slow for cross-cloud paths. Applies via
  # konnectivity-agent's hostNetwork (set under addons.konnectivity.agent).
  - op: add
    path: /machine/sysctls
    value:
      net.ipv4.tcp_keepalive_time: "60"
      net.ipv4.tcp_keepalive_intvl: "10"
      net.ipv4.tcp_keepalive_probes: "3"
  # Embed cluster CA into Talos worker bootstrap config when the Kamaji-
  # managed Secret already exists. On the very first render the Secret
  # does not exist yet (KamajiControlPlane is part of this same chart and
  # needs to create itself first), so the patch is silently omitted. The
  # next reconcile finds the Secret, adds the patch, and the TCT spec
  # hash changes once — CAPI rolls the worker pool to pick it up. That
  # one-time roll happens minutes after bootstrap when nothing is yet
  # scheduled on the workers, so it is acceptable. Failing render until
  # the Secret appears deadlocks because the Secret is produced by a
  # resource this same render is responsible for creating.
  {{- $kamajiCA := lookup "v1" "Secret" $.Release.Namespace (printf "%s-ca" $.Release.Name) }}
  {{- if and $kamajiCA $kamajiCA.data (index $kamajiCA.data "tls.crt") }}
  - op: replace
    path: /cluster/ca/crt
    value: {{ index $kamajiCA.data "tls.crt" }}
  {{- end }}
  {{- with .group.extraConfigPatches }}
  # Per-node-group Talos config patches, scoped to this group only. Each node
  # group renders its own TalosConfigTemplate whose name embeds a hash of this
  # rendered spec (see the range below), so setting extraConfigPatches on one
  # group changes only that group's hash: sibling groups keep their existing
  # TCT and are NOT rolled. Use this to enable GPU nodes (load NVIDIA kernel
  # modules), add kernel args, or set extra sysctls on a single group without
  # a cluster-wide worker replacement. Patches apply after the built-in ones
  # above, so appending to the base module list works, e.g.
  #   - op: add
  #     path: /machine/kernel/modules/-
  #     value: { name: nvidia }
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}

{{/*
OpenStackMachineTemplate spec fragment used for hash-based immutability.
Must be defined at file scope (not inside range).
*/}}
{{- define "openstackmachinetemplate" -}}
flavor: {{ .group.flavorName }}
image:
  filter:
    name: {{ .group.imageName }}
identityRef:
  name: {{ include "kubernetes-switchcloud.credentialsSecretName" $ }}
  cloudName: {{ $.Values.openstack.cloudName }}
{{- if .group.rootVolume }}
rootVolume:
  sizeGiB: {{ .group.rootVolume.sizeGiB }}
  {{- if .group.rootVolume.type }}
  type: {{ .group.rootVolume.type }}
  {{- end }}
{{- end }}
{{- if $.Values.openstack.floatingIPNetwork }}
floatingIPPoolRef:
  apiGroup: infrastructure.cluster.x-k8s.io
  kind: OpenStackFloatingIPPool
  name: {{ include "kubernetes-switchcloud.floatingIPPoolName" $ }}
{{- end }}
securityGroups:
{{- range (.group.securityGroups | default (list "default")) }}
- filter:
    name: {{ . }}
{{- end }}
{{- end }}

{{- $etcd := .Values._namespace.etcd }}
{{- $ingress := .Values._namespace.ingress }}
{{- $host := .Values._namespace.host }}
{{- $credSecret := include "kubernetes-switchcloud.credentialsSecretName" . }}

{{/*
Collect names of all immutable templates rendered this pass for the
preservation logic at the end of this file.
*/}}
{{- $openstackMachineTemplateNames := list }}
{{- $talosConfigTemplateNames := list }}

{{- if not $etcd }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-awaiting-etcd
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: kubernetes-switchcloud
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  status: "awaiting-etcd"
  message: |
    No DataStore is available for this tenant Kubernetes cluster.
    Set spec.etcd: true on an ancestor Tenant and wait for its HelmRelease
    to reconcile — this HelmRelease will pick up the DataStore on its next
    5m reconcile loop and provision the cluster.
{{- else }}
---
{{- if not .Values.openstack.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-openstack-credentials
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  clouds.yaml: |
    clouds:
      {{ .Values.openstack.cloudName }}:
        auth:
          auth_url: {{ .Values.openstack.authURL }}
          application_credential_id: {{ .Values.openstack.applicationCredentialID }}
          application_credential_secret: {{ .Values.openstack.applicationCredentialSecret }}
        auth_type: v3applicationcredential
        region_name: {{ .Values.openstack.regionName }}
---
{{- end }}
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
      - {{ .Values.network.podCIDR }}
    services:
      cidrBlocks:
      - {{ .Values.network.serviceCIDR }}
  controlPlaneRef:
    namespace: {{ .Release.Namespace }}
    apiVersion: controlplane.cluster.x-k8s.io/v1alpha1
    kind: KamajiControlPlane
    name: {{ .Release.Name }}
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: OpenStackCluster
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: controlplane.cluster.x-k8s.io/v1alpha1
kind: KamajiControlPlane
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    cluster.x-k8s.io/role: control-plane
  annotations:
    kamaji.clastix.io/kubeconfig-secret-key: "super-admin.svc"
spec:
  apiServer:
    resources: {{ toYaml .Values.controlPlane.apiServer.resources | nindent 6 }}
  controllerManager:
    resources: {{ toYaml .Values.controlPlane.controllerManager.resources | nindent 6 }}
  scheduler:
    resources: {{ toYaml .Values.controlPlane.scheduler.resources | nindent 6 }}
  dataStoreName: "{{ $etcd }}"
  addons:
    konnectivity:
      server:
        port: 8132
        extraArgs:
        # gRPC keepalive PING every 30s so the server actually notices when
        # an agent's TCP dies (RST through Switch Cloud egress NAT or dev3
        # conntrack). Without this the server held stale backend entries
        # for up to 7200s of TCP-keepalive default while the agent had long
        # since reconnected; some dial requests still got routed to the dead
        # backend and hung 30s before frontend_close.
        - --keepalive-time=30s
      # Kamaji defaults --proxy-server-host to the in-cluster ClusterIP, which
      # is unreachable from workers running on Switch Cloud. Override it to the
      # cluster's public hostname; talos-edge-router exposes :8132 there.
      agent:
        # Use host network so the agent's outbound TCP to konn-server picks
        # up the node-level tcp_keepalive_* sysctls (set above), keeping the
        # long-lived gRPC stream alive through Switch Cloud egress NAT and
        # dev3 Cilium conntrack.
        hostNetwork: true
        extraArgs:
        - --proxy-server-host={{ .Values.host | default (printf "%s.%s" .Release.Name $host) }}
        # Larger backlog so the dispatcher channel doesn't fill up during
        # bursts of dial requests (kubectl logs against many pods, metrics
        # aggregation polls). Default 150 saturates fast and blocks the
        # recv loop, which collapses the whole gRPC stream.
        - --xfr-channel-size=10000
        - --warn-on-channel-limit
  kubelet:
    cgroupfs: systemd
    preferredAddressTypes:
    - InternalIP
    - ExternalIP
  network:
    serviceType: ClusterIP
    ingress:
      extraAnnotations:
        nginx.ingress.kubernetes.io/ssl-passthrough: "true"
      hostname: {{ .Values.host | default (printf "%s.%s" .Release.Name $host) }}:443
      className: "{{ .Values.ingressClassName | default $ingress }}"
  deployment:
    podAdditionalMetadata:
      labels:
        policy.cozystack.io/allow-to-etcd: "true"
  replicas: {{ .Values.controlPlane.replicas }}
  version: {{ trimPrefix "v" .Values.version }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: OpenStackCluster
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  identityRef:
    name: {{ $credSecret }}
    cloudName: {{ .Values.openstack.cloudName }}
{{- if .Values.openstack.network.id }}
  # Legacy mode: operator-provisioned network. CAPO consumes a
  # pre-existing Neutron network by ID. Workers join L2 with whatever
  # else lives in this network — no per-cluster isolation.
  network:
    id: {{ .Values.openstack.network.id }}
{{- else }}
  # Auto-managed mode: CAPO creates a dedicated Neutron network,
  # subnet, and router (with external gateway) per cluster on apply,
  # and tears them down on cluster delete. Per-cluster L2/L3 isolation
  # comes for free — distinct networks across clusters mean no shared
  # broadcast / ARP domain and no implicit cross-cluster routing.
  managedSubnets:
    - cidr: {{ .Values.openstack.network.subnetCIDR | quote }}
{{- with .Values.openstack.network.dnsNameservers }}
      dnsNameservers:
{{- range . }}
        - {{ . | quote }}
{{- end }}
{{- end }}
{{- if .Values.openstack.network.externalNetworkID }}
  externalNetworkId: {{ .Values.openstack.network.externalNetworkID }}
{{- end }}
  # CAPO-managed control + worker security groups with the k8s
  # baseline open (kubelet, etcd, kAPI, CNI, inter-node). Per-Service
  # NodePort rules are added on top by the loadbalancer-controller.
  managedSecurityGroups: {}
{{- end }}
  apiServerLoadBalancer:
    enabled: false
  disableAPIServerFloatingIP: true
{{- if .Values.openstack.network.id }}
  # Legacy mode only: the operator's pre-existing network is wired
  # to the project's external network out-of-band, so CAPO must not
  # try to attach a separate one. Auto-managed mode (else branch
  # above) DOES want CAPO to attach the router's external gateway —
  # without it managedSubnets workers have no egress.
  disableExternalNetwork: true
{{- end }}
{{- if .Values.openstack.floatingIPNetwork }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: OpenStackFloatingIPPool
metadata:
  name: {{ include "kubernetes-switchcloud.floatingIPPoolName" . }}
  namespace: {{ .Release.Namespace }}
spec:
  identityRef:
    name: {{ $credSecret }}
    cloudName: {{ .Values.openstack.cloudName }}
  floatingIPNetwork:
    filter:
      name: {{ .Values.openstack.floatingIPNetwork }}
  reclaimPolicy: Delete
{{- end }}
{{- range $groupName, $group := .Values.nodeGroups }}
{{/*
Compute kubelet reservations:
  system-reserved and kube-reserved = 5% of effective memory, clamped [256Mi, 1Gi].
  system-reserved and kube-reserved CPU = 5% of effective CPU, clamped [50m, 500m].
*/}}
{{- $effectiveMemory := "" }}
{{- if and $group.resources $group.resources.memory }}
{{-   $effectiveMemory = $group.resources.memory | toString }}
{{- end }}
{{- $effectiveCpu := "" }}
{{- if and $group.resources $group.resources.cpu }}
{{-   $effectiveCpu = $group.resources.cpu | toString }}
{{- end }}
{{- $autoReservedMi := 256 }}
{{- if $effectiveMemory }}
{{-   $effectiveMemBytes := include "kubernetes-switchcloud.memoryToBytes" $effectiveMemory | float64 }}
{{-   $effectiveMemMi := divf $effectiveMemBytes 1048576.0 | int }}
{{-   $fivePercentMi := mulf ($effectiveMemMi | float64) 0.05 | int }}
{{-   $autoReservedMi = min (max $fivePercentMi 256) 1024 }}
{{- end }}
{{- $autoReservedMillicores := 50 }}
{{- if $effectiveCpu }}
{{-   $effectiveCpuMillicores := include "kubernetes-switchcloud.cpuToMillicores" $effectiveCpu | int }}
{{-   $fivePercentMillis := mulf ($effectiveCpuMillicores | float64) 0.05 | int }}
{{-   $autoReservedMillicores = min (max $fivePercentMillis 50) 500 }}
{{- end }}
{{- $kubeletOverride := $group.kubelet | default dict }}
{{- $systemReservedMemory := $kubeletOverride.systemReservedMemory | default (printf "%dMi" $autoReservedMi) }}
{{- $kubeReservedMemory := $kubeletOverride.kubeReservedMemory | default (printf "%dMi" $autoReservedMi) }}
{{- $systemReservedCpu := $kubeletOverride.systemReservedCpu | default (printf "%dm" $autoReservedMillicores) }}
{{- $kubeReservedCpu := $kubeletOverride.kubeReservedCpu | default (printf "%dm" $autoReservedMillicores) }}
{{- $evictionHardMemory := $kubeletOverride.evictionHardMemory | default "7%" }}
{{- $evictionSoftMemory := $kubeletOverride.evictionSoftMemory | default "10%" }}
{{- $context := deepCopy $ }}
{{- $_ := set $context "group" $group }}
{{- $_ := set $context "groupName" $groupName }}
{{- $_ := set $context "systemReservedMemory" $systemReservedMemory }}
{{- $_ := set $context "kubeReservedMemory" $kubeReservedMemory }}
{{- $_ := set $context "systemReservedCpu" $systemReservedCpu }}
{{- $_ := set $context "kubeReservedCpu" $kubeReservedCpu }}
{{- $_ := set $context "evictionHardMemory" $evictionHardMemory }}
{{- $_ := set $context "evictionSoftMemory" $evictionSoftMemory }}
{{/*
Hash on the canonical YAML (parse + re-serialize) rather than on the raw
template output. Raw output includes YAML comments and is sensitive to
whitespace and key ordering, none of which affect the spec that CAPI
actually stores. Hashing the raw fragment makes editing a comment look
like a spec change to MachineDeployment and triggers a full worker pool
roll, which is what `# Embed cluster CA ...` did when first introduced.
*/}}
{{- $talosConfigFields := include "talosconfigtemplate" $context }}
{{- $talosConfigHash := $talosConfigFields | fromYaml | toYaml | sha256sum | trunc 6 }}
{{- $talosConfigName := printf "%s-%s-%s" $.Release.Name $groupName $talosConfigHash }}
{{- $talosConfigTemplateNames = append $talosConfigTemplateNames $talosConfigName }}
{{- $templateFields := include "openstackmachinetemplate" $context }}
{{- $templateHash := $templateFields | fromYaml | toYaml | sha256sum | trunc 6 }}
{{- $templateName := printf "%s-%s-%s" $.Release.Name $groupName $templateHash }}
{{- $openstackMachineTemplateNames = append $openstackMachineTemplateNames $templateName }}
---
apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
kind: TalosConfigTemplate
metadata:
  name: {{ $talosConfigName }}
  namespace: {{ $.Release.Namespace }}
spec:
  template:
    spec:
      {{- $talosConfigFields | nindent 6 }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: OpenStackMachineTemplate
metadata:
  name: {{ $templateName }}
  namespace: {{ $.Release.Namespace }}
spec:
  template:
    spec:
      {{- $templateFields | nindent 6 }}
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: {{ $.Release.Name }}-{{ $groupName }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    cluster.x-k8s.io/cluster-api-autoscaler-node-group-min-size: "{{ $group.minReplicas }}"
    cluster.x-k8s.io/cluster-api-autoscaler-node-group-max-size: "{{ $group.maxReplicas }}"
    {{- if $effectiveMemory }}
    {{-   $sysBytes := include "kubernetes-switchcloud.memoryToBytes" $systemReservedMemory | float64 }}
    {{-   $kubeBytes := include "kubernetes-switchcloud.memoryToBytes" $kubeReservedMemory | float64 }}
    {{-   $evictionBytes := 0.0 }}
    {{-   if hasSuffix "%" $evictionHardMemory }}
    {{-     $pct := trimSuffix "%" $evictionHardMemory | float64 }}
    {{-     $evictionBytes = mulf (include "kubernetes-switchcloud.memoryToBytes" $effectiveMemory | float64) (divf $pct 100.0) }}
    {{-   else }}
    {{-     $evictionBytes = include "kubernetes-switchcloud.memoryToBytes" $evictionHardMemory | float64 }}
    {{-   end }}
    {{-   $totalReservedBytes := addf (addf $sysBytes $kubeBytes) $evictionBytes }}
    {{-   $effectiveMemBytes := include "kubernetes-switchcloud.memoryToBytes" $effectiveMemory | float64 }}
    {{-   $allocatableBytes := subf $effectiveMemBytes $totalReservedBytes }}
    {{-   $allocatableMi := divf $allocatableBytes 1048576.0 | floor | int }}
    capacity.cluster-autoscaler.kubernetes.io/memory: "{{ $allocatableMi }}Mi"
    {{- end }}
    {{- if $effectiveCpu }}
    {{-   $sysCpuMillis := include "kubernetes-switchcloud.cpuToMillicores" $systemReservedCpu | float64 }}
    {{-   $kubeCpuMillis := include "kubernetes-switchcloud.cpuToMillicores" $kubeReservedCpu | float64 }}
    {{-   $effectiveCpuMillis := include "kubernetes-switchcloud.cpuToMillicores" $effectiveCpu | float64 }}
    {{-   $allocatableCpuMillis := subf $effectiveCpuMillis (addf $sysCpuMillis $kubeCpuMillis) | ceil | int }}
    capacity.cluster-autoscaler.kubernetes.io/cpu: "{{ $allocatableCpuMillis }}m"
    {{- end }}
spec:
  clusterName: {{ $.Release.Name }}
  replicas: {{ $group.minReplicas }}
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: {{ $.Release.Name }}
      cluster.x-k8s.io/deployment-name: {{ $.Release.Name }}-{{ $groupName }}
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: {{ $.Release.Name }}
        cluster.x-k8s.io/deployment-name: {{ $.Release.Name }}-{{ $groupName }}
        {{- range $group.roles }}
        node-role.kubernetes.io/{{ . }}: ""
        {{- end }}
    spec:
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
          kind: TalosConfigTemplate
          name: {{ $talosConfigName }}
          namespace: {{ $.Release.Namespace }}
      clusterName: {{ $.Release.Name }}
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: OpenStackMachineTemplate
        name: {{ $templateName }}
        namespace: {{ $.Release.Namespace }}
      version: {{ $.Values.version }}
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineHealthCheck
metadata:
  name: {{ $.Release.Name }}-{{ $groupName }}
  namespace: {{ $.Release.Namespace }}
spec:
  clusterName: {{ $.Release.Name }}
  # Default 0 trips MHC's safety brake on any unhealthy machine, so it is
  # observe-only. With the previous default of 1, a single-node MachineDeployment
  # would death-spiral during bootstrap: the only node boots NotReady (no CNI
  # installed yet), 1 unhealthy <= 1 maxUnhealthy triggers remediation, the
  # Machine is deleted and recreated, the new Machine boots NotReady, loop
  # forever. Operators wanting steady-state self-healing on multi-node groups
  # should override per node group (e.g. maxUnhealthy: 1 or "50%").
  maxUnhealthy: {{ $group.maxUnhealthy | default 0 }}
  nodeStartupTimeout: {{ $group.nodeStartupTimeout | default "10m" }}
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: {{ $.Release.Name }}
      cluster.x-k8s.io/deployment-name: {{ $.Release.Name }}-{{ $groupName }}
  unhealthyConditions:
  - type: Ready
    status: Unknown
    timeout: 5m
  - type: Ready
    status: "False"
    timeout: 300s
{{- end }}
---
{{- /*
Preserve OpenStackMachineTemplates and TalosConfigTemplates still referenced
by active MachineSets (immutable resources — safe to keep, must not be
deleted while in use).
*/}}
{{- $mss := (lookup "cluster.x-k8s.io/v1beta1" "MachineSet" $.Release.Namespace "").items }}
{{- $oldTemplates := dict }}
{{- range $tpl := (lookup "infrastructure.cluster.x-k8s.io/v1beta1" "OpenStackMachineTemplate" .Release.Namespace "").items }}
{{- range $or := $tpl.metadata.ownerReferences }}
{{- if and (eq $or.kind "Cluster") (eq $or.name $.Release.Name) }}
{{- range $ms := $mss }}
{{- if and (eq $ms.spec.template.spec.infrastructureRef.kind "OpenStackMachineTemplate") (eq $ms.spec.template.spec.infrastructureRef.name $tpl.metadata.name) }}
{{- if not (has $tpl.metadata.name $openstackMachineTemplateNames) }}
{{- $oldTemplates = merge $oldTemplates (dict $tpl.metadata.name $tpl) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- range $oldTemplates }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: OpenStackMachineTemplate
metadata:
  name: {{ .metadata.name }}
  namespace: {{ .metadata.namespace }}
spec:
  {{- .spec | toYaml | nindent 2 }}
{{- end }}
{{- $oldTalosConfigTemplates := dict }}
{{- range $tpl := (lookup "bootstrap.cluster.x-k8s.io/v1alpha3" "TalosConfigTemplate" .Release.Namespace "").items }}
{{- if hasPrefix (printf "%s-" $.Release.Name) $tpl.metadata.name }}
{{- range $ms := $mss }}
{{- if and (eq $ms.spec.template.spec.bootstrap.configRef.kind "TalosConfigTemplate") (eq $ms.spec.template.spec.bootstrap.configRef.name $tpl.metadata.name) }}
{{- if not (has $tpl.metadata.name $talosConfigTemplateNames) }}
{{- $oldTalosConfigTemplates = merge $oldTalosConfigTemplates (dict $tpl.metadata.name $tpl) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- range $oldTalosConfigTemplates }}
---
apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
kind: TalosConfigTemplate
metadata:
  name: {{ .metadata.name }}
  namespace: {{ .metadata.namespace }}
spec:
  {{- .spec | toYaml | nindent 2 }}
{{- end }}
{{- end }}
