apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-csr-signer
  labels:
    app: {{ .Release.Name }}-csr-signer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-csr-signer
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-csr-signer
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: csr-signer
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        - --addr=:50001
        - --talos-bundle=/secrets
        {{- if .Values.clusterHostname }}
        - --cluster-hostname={{ .Values.clusterHostname }}
        {{- end }}
        {{- if .Values.workloadKubeconfigSecret }}
        - --workload-kubeconfig=/workload-kubeconfig/value
        {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        ports:
        - name: trustd
          containerPort: 50001
          protocol: TCP
        volumeMounts:
        - name: talos-bundle
          mountPath: /secrets
          readOnly: true
        {{- if .Values.workloadKubeconfigSecret }}
        - name: workload-kubeconfig
          mountPath: /workload-kubeconfig
          readOnly: true
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        readinessProbe:
          tcpSocket:
            port: 50001
          initialDelaySeconds: 3
          periodSeconds: 10
      volumes:
      - name: talos-bundle
        secret:
          secretName: {{ required "talosBundleSecret is required" .Values.talosBundleSecret }}
      {{- if .Values.workloadKubeconfigSecret }}
      - name: workload-kubeconfig
        secret:
          secretName: {{ .Values.workloadKubeconfigSecret }}
          items:
          - key: value
            path: value
      {{- end }}
