apiVersion: v1
kind: ServiceAccount
metadata:
  name: talos-edge-router
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: talos-edge-router
rules:
- apiGroups: [""]
  resources: [services]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [nodes]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: talos-edge-router
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: talos-edge-router
subjects:
- kind: ServiceAccount
  name: talos-edge-router
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: talos-edge-router-ipsync
rules:
- apiGroups: [""]
  resources: [services]
  verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: talos-edge-router-ipsync
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: talos-edge-router-ipsync
subjects:
- kind: ServiceAccount
  name: talos-edge-router
  namespace: {{ .Release.Namespace }}
