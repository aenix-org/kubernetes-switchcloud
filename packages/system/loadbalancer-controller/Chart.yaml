apiVersion: v2
name: cozy-loadbalancer-controller
description: |
  Centralised OpenStack LoadBalancer provisioner for Cozystack
  KubernetesSwitchcloud tenants. Lives in the management cluster,
  watches Service objects in every tenant via Kamaji admin-kubeconfig
  Secrets, and creates matching Octavia LBs in Switch Cloud. Tenant
  users get LoadBalancer Services without ever handling OpenStack
  credentials themselves.
type: application
version: 0.0.0 # Placeholder, the actual version will be automatically set during the build process
appVersion: "0.10.4"
maintainers:
  - name: Aenix
    email: support@aenix.io
