suite: serviceaccount
templates:
  - serviceaccount.yaml
tests:
  - it: should render serviceaccount when create is true
    set:
      serviceAccount.create: true
    asserts:
      - isKind:
          of: ServiceAccount

  - it: should not render serviceaccount when create is false
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should not disable automountServiceAccountToken (operator needs in-cluster token)
    set:
      serviceAccount.create: true
    asserts:
      - notExists:
          path: automountServiceAccountToken

  - it: should default name to release-name-chart-name
    release:
      name: my-release
    set:
      serviceAccount.create: true
      serviceAccount.name: ""
    asserts:
      - equal:
          path: metadata.name
          value: my-release-kilo-clustermesh-operator

  - it: should use custom name when specified
    set:
      serviceAccount.create: true
      serviceAccount.name: custom-sa
    asserts:
      - equal:
          path: metadata.name
          value: custom-sa

  - it: should apply custom annotations
    set:
      serviceAccount.create: true
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/my-role
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: "arn:aws:iam::123456789012:role/my-role"

  - it: should have standard labels
    release:
      name: my-release
    set:
      serviceAccount.create: true
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: kilo-clustermesh-operator
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: my-release
