apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kilo-clustermesh-operator.fullname" . }}
  labels:
    {{- include "kilo-clustermesh-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch
      - patch
  # ClusterMesh CRs and the Secrets they reference are watched cluster-wide
  # so users can colocate them with the Kamaji-managed tenant kubeconfig
  # Secrets in any namespace (typically `tenant-root` for Cozystack).
  - apiGroups:
      - kilo.squat.ai
    resources:
      - clustermeshes
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - kilo.squat.ai
    resources:
      - clustermeshes/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - kilo.squat.ai
    resources:
      - clustermeshes/finalizers
    verbs:
      - update
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - kilo.squat.ai
    resources:
      - peers
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - create
      - update
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - create
      - update
