{{- if and (.Values.addons.tenantApiserverProxy.enabled | default true) .Values._namespace.etcd }}
{{- $host := .Values._namespace.host }}
{{- $upstream := printf "%s:443" (.Values.host | default (printf "%s.%s" .Release.Name $host)) }}
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: OCIRepository
metadata:
  name: {{ .Release.Name }}-tenant-apiserver-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    cozystack.io/target-cluster-name: {{ .Release.Name }}
spec:
  interval: 5m
  url: {{ index .Chart.Annotations "tenant-apiserver-proxy/chart-url" }}
  ref:
    tag: {{ index .Chart.Annotations "tenant-apiserver-proxy/chart-version" }}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .Release.Name }}-tenant-apiserver-proxy
  labels:
    cozystack.io/target-cluster-name: {{ .Release.Name }}
    sharding.fluxcd.io/key: tenants
spec:
  releaseName: tenant-apiserver-proxy
  chartRef:
    kind: OCIRepository
    name: {{ .Release.Name }}-tenant-apiserver-proxy
    namespace: {{ .Release.Namespace }}
  kubeConfig:
    secretRef:
      name: {{ .Release.Name }}-admin-kubeconfig
      key: super-admin.svc
  targetNamespace: kube-system
  storageNamespace: kube-system
  interval: 5m
  timeout: 5m
  install:
    createNamespace: false
    # The DaemonSet only schedules onto worker nodes, which CAPI provisions
    # asynchronously, and its DNAT init container needs the workload cluster
    # to be reachable. Waiting for Pods to be Ready stalls the umbrella
    # install for the full timeout; the DaemonSet rolls forward as soon as
    # a worker joins.
    disableWait: true
    remediation:
      retries: -1
  upgrade:
    disableWait: true
    remediation:
      retries: -1
  uninstall:
    timeout: 2m
  # Cert + key + cluster CA are pulled at install time from the Kamaji-managed
  # Secrets. Using `valuesFrom` instead of a `lookup` block at template-render
  # time avoids a race: Kamaji creates the Secrets a few seconds after the
  # umbrella chart is first rendered, so the previous `lookup` returned nil
  # and the HR was skipped entirely (recoverable only by a manual reconcile
  # once the Secrets appeared). With `valuesFrom`, the HR is always rendered
  # and Flux retries the install until the Secrets are populated.
  valuesFrom:
  - kind: Secret
    name: {{ .Release.Name }}-api-server-certificate
    valuesKey: apiserver.crt
    targetPath: tls.cert
  - kind: Secret
    name: {{ .Release.Name }}-api-server-certificate
    valuesKey: apiserver.key
    targetPath: tls.key
  - kind: Secret
    name: {{ .Release.Name }}-ca
    valuesKey: tls.crt
    targetPath: tls.ca
  values:
    upstream: {{ $upstream }}
    {{- with .Values.addons.tenantApiserverProxy.valuesOverride }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
