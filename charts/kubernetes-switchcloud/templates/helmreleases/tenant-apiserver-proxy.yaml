{{- if and (.Values.addons.tenantApiserverProxy.enabled | default true) .Values._namespace.etcd }}
{{- $host := .Values._namespace.host }}
{{- $upstream := printf "%s:443" (.Values.host | default (printf "%s.%s" .Release.Name $host)) }}
{{- $apiserverSecret := lookup "v1" "Secret" $.Release.Namespace (printf "%s-api-server-certificate" $.Release.Name) }}
{{- $caSecret := lookup "v1" "Secret" $.Release.Namespace (printf "%s-ca" $.Release.Name) }}
{{- /*
The proxy's server cert + cluster CA come from Kamaji-managed Secrets in this
namespace. They do not exist on the very first reconcile (Kamaji creates them
alongside the apiserver pod), and `helm lint` has no cluster context to look
them up at all. Skip rendering in both cases — Flux will reconcile again as
soon as the Secrets appear.
*/}}
{{- if and $apiserverSecret $caSecret $apiserverSecret.data $caSecret.data (index $apiserverSecret.data "apiserver.crt") (index $apiserverSecret.data "apiserver.key") (index $caSecret.data "tls.crt") }}
{{- $tlsCert := (index $apiserverSecret.data "apiserver.crt") | b64dec }}
{{- $tlsKey  := (index $apiserverSecret.data "apiserver.key") | b64dec }}
{{- $caCert  := (index $caSecret.data "tls.crt") | b64dec }}
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: OCIRepository
metadata:
  name: {{ .Release.Name }}-tenant-apiserver-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    cozystack.io/target-cluster-name: {{ .Release.Name }}
spec:
  interval: 5m
  url: {{ index .Chart.Annotations "tenant-apiserver-proxy/chart-url" }}
  ref:
    tag: {{ index .Chart.Annotations "tenant-apiserver-proxy/chart-version" }}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .Release.Name }}-tenant-apiserver-proxy
  labels:
    cozystack.io/target-cluster-name: {{ .Release.Name }}
    sharding.fluxcd.io/key: tenants
spec:
  releaseName: tenant-apiserver-proxy
  chartRef:
    kind: OCIRepository
    name: {{ .Release.Name }}-tenant-apiserver-proxy
    namespace: {{ .Release.Namespace }}
  kubeConfig:
    secretRef:
      name: {{ .Release.Name }}-admin-kubeconfig
      key: super-admin.svc
  targetNamespace: kube-system
  storageNamespace: kube-system
  interval: 5m
  timeout: 5m
  install:
    createNamespace: false
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  uninstall:
    timeout: 2m
  values:
    upstream: {{ $upstream }}
    tls:
      cert: |
        {{- $tlsCert | nindent 8 }}
      key: |
        {{- $tlsKey | nindent 8 }}
      ca: |
        {{- $caCert | nindent 8 }}
    {{- with .Values.addons.tenantApiserverProxy.valuesOverride }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
