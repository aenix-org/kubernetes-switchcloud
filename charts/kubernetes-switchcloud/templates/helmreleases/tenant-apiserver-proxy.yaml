{{- if and (.Values.addons.tenantApiserverProxy.enabled | default true) .Values._namespace.etcd }}
{{- $host := .Values._namespace.host }}
{{- $upstream := printf "%s:443" (.Values.host | default (printf "%s.%s" .Release.Name $host)) }}
{{/*
The tenant-apiserver-proxy DaemonSet installs an iptables DNAT rule on every
worker so traffic destined to the in-cluster `kubernetes` Service IP is
redirected to its local proxy (which forwards through konnectivity to the
Kamaji-hosted apiserver). That IP is the first address of the tenant's
serviceCIDR — Kubernetes always allocates `kubernetes.default.svc`'s
clusterIP at that slot.

The proxy chart defaults to `10.95.0.1`, which only happens to match
tenants whose serviceCIDR is 10.95.0.0/16; every other tenant's DNAT rule
misses its real apiserver IP and all in-cluster API calls hang —
cainjector / coredns / metrics-server / cert-manager-webhook fail
readiness probes and crashloop. Derive the correct first-IP from
.Values.network.serviceCIDR and pass it through so any shape works.
*/}}
{{- /* default fallback covers partial-overrides that omit network.serviceCIDR
       — regexReplaceAll panics on a nil argument, which would brick the
       whole render. The 10.95.0.0/16 default matches the upstream proxy
       chart's hardcoded kubernetesServiceIP "10.95.0.1", preserving the
       pre-PR-98 behaviour for any caller that doesn't set serviceCIDR. */}}
{{- $svcCIDR := .Values.network.serviceCIDR | default "10.95.0.0/16" }}
{{- $svcBase := regexReplaceAll "/.*$" $svcCIDR "" }}
{{- $svcOctets := splitList "." $svcBase }}
{{- $kubeSvcIP := printf "%s.%s.%s.1" (index $svcOctets 0) (index $svcOctets 1) (index $svcOctets 2) }}
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: OCIRepository
metadata:
  name: {{ .Release.Name }}-tenant-apiserver-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    cozystack.io/target-cluster-name: {{ .Release.Name }}
spec:
  interval: 5m
  url: {{ index .Chart.Annotations "tenant-apiserver-proxy/chart-url" }}
  ref:
    tag: {{ index .Chart.Annotations "tenant-apiserver-proxy/chart-version" }}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .Release.Name }}-tenant-apiserver-proxy
  labels:
    cozystack.io/target-cluster-name: {{ .Release.Name }}
    sharding.fluxcd.io/key: tenants
spec:
  releaseName: tenant-apiserver-proxy
  chartRef:
    kind: OCIRepository
    name: {{ .Release.Name }}-tenant-apiserver-proxy
    namespace: {{ .Release.Namespace }}
  kubeConfig:
    secretRef:
      name: {{ .Release.Name }}-admin-kubeconfig
      key: super-admin.svc
  targetNamespace: kube-system
  storageNamespace: kube-system
  interval: 5m
  timeout: 10m
  install:
    createNamespace: false
    remediation:
      retries: -1
  upgrade:
    force: true
    remediation:
      retries: -1
  uninstall:
    timeout: 2m
  # Cert + key + cluster CA are pulled at install time from the Kamaji-managed
  # Secrets. Using `valuesFrom` instead of a `lookup` block at template-render
  # time avoids a race: Kamaji creates the Secrets a few seconds after the
  # umbrella chart is first rendered, so the previous `lookup` returned nil
  # and the HR was skipped entirely (recoverable only by a manual reconcile
  # once the Secrets appeared). With `valuesFrom`, the HR is always rendered
  # and Flux retries the install until the Secrets are populated.
  valuesFrom:
  - kind: Secret
    name: {{ .Release.Name }}-api-server-certificate
    valuesKey: apiserver.crt
    targetPath: tls.cert
  - kind: Secret
    name: {{ .Release.Name }}-api-server-certificate
    valuesKey: apiserver.key
    targetPath: tls.key
  - kind: Secret
    name: {{ .Release.Name }}-ca
    valuesKey: tls.crt
    targetPath: tls.ca
  values:
    upstream: {{ $upstream }}
    kubernetesServiceIP: {{ $kubeSvcIP | quote }}
    {{- with .Values.addons.tenantApiserverProxy.valuesOverride }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
