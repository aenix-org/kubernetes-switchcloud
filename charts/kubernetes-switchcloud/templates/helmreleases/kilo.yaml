{{- if and .Values.addons.kilo.enabled .Values._namespace.etcd }}
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: OCIRepository
metadata:
  name: {{ .Release.Name }}-kilo
  namespace: {{ .Release.Namespace }}
  labels:
    cozystack.io/target-cluster-name: {{ .Release.Name }}
spec:
  interval: 5m
  url: {{ index .Chart.Annotations "kilo/chart-url" }}
  ref:
    tag: {{ index .Chart.Annotations "kilo/chart-version" }}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .Release.Name }}-kilo
  labels:
    cozystack.io/target-cluster-name: {{ .Release.Name }}
    sharding.fluxcd.io/key: tenants
spec:
  releaseName: kilo
  chartRef:
    kind: OCIRepository
    name: {{ .Release.Name }}-kilo
    namespace: {{ .Release.Namespace }}
  kubeConfig:
    secretRef:
      name: {{ .Release.Name }}-admin-kubeconfig
      key: super-admin.svc
  targetNamespace: cozy-kilo
  storageNamespace: cozy-kilo
  interval: 5m
  timeout: 10m
  install:
    createNamespace: true
    remediation:
      retries: -1
  upgrade:
    force: true
    remediation:
      retries: -1
  uninstall:
    timeout: 2m
  # Build defaults the chart enforces when ClusterMesh is wired up, then
  # deep-merge operator-supplied valuesOverride on top. Doing this in a
  # single toYaml pass avoids emitting two top-level `kilo:` keys in the
  # HR values block (helm-controller's YAML parser would keep only the
  # last and silently drop the mesh wiring).
  {{- $defaults := dict }}
  {{- if .Values.addons.kilo.clusterMesh.remoteClusters }}
  {{- $_ := set $defaults "kilo" (dict
        "nodeAnnotator" (dict
          "enabled" true
          "port" (.Values.addons.kilo.clusterMesh.wireguardPort | default 51820))
        "encapsulate" "always") }}
  {{- end }}
  values:
    {{- toYaml (mergeOverwrite (deepCopy $defaults) (.Values.addons.kilo.valuesOverride | default dict)) | nindent 4 }}
  dependsOn:
  - name: {{ .Release.Name }}-cilium
    namespace: {{ .Release.Namespace }}
{{- end }}
