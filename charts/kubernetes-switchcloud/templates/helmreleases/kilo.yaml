{{- if and .Values.addons.kilo.enabled .Values._namespace.etcd }}
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: OCIRepository
metadata:
  name: {{ .Release.Name }}-kilo
  namespace: {{ .Release.Namespace }}
  labels:
    cozystack.io/target-cluster-name: {{ .Release.Name }}
spec:
  interval: 5m
  url: {{ index .Chart.Annotations "kilo/chart-url" }}
  ref:
    tag: {{ index .Chart.Annotations "kilo/chart-version" }}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .Release.Name }}-kilo
  labels:
    cozystack.io/target-cluster-name: {{ .Release.Name }}
    sharding.fluxcd.io/key: tenants
spec:
  releaseName: kilo
  chartRef:
    kind: OCIRepository
    name: {{ .Release.Name }}-kilo
    namespace: {{ .Release.Namespace }}
  kubeConfig:
    secretRef:
      name: {{ .Release.Name }}-admin-kubeconfig
      key: super-admin.svc
  targetNamespace: cozy-kilo
  storageNamespace: cozy-kilo
  interval: 5m
  timeout: 10m
  install:
    createNamespace: true
    remediation:
      retries: -1
  upgrade:
    force: true
    remediation:
      retries: -1
  uninstall:
    timeout: 2m
  values:
    kilo:
      {{- if .Values.addons.kilo.clusterMesh.remoteClusters }}
      # ClusterMesh is wired up — annotate each node with its InternalIP
      # so kilo-clustermesh-operator can resolve a WireGuard endpoint
      # when the tenant has no NodeExternalIP.
      nodeAnnotator:
        enabled: true
        port: {{ .Values.addons.kilo.clusterMesh.wireguardPort | default 51820 }}
      # Tunnel pod traffic even between peers on the same underlay subnet;
      # otherwise Kilo skips the WG path for the local /16 and the remote
      # cluster's pod CIDR has no route.
      encapsulate: always
      {{- end }}
  {{- with .Values.addons.kilo.valuesOverride }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  dependsOn:
  - name: {{ .Release.Name }}-cilium
    namespace: {{ .Release.Namespace }}
{{- end }}
