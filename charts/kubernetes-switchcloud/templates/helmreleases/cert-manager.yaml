{{- if and .Values.addons.certManager.enabled .Values._namespace.etcd }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .Release.Name }}-cert-manager
  labels:
    cozystack.io/repository: system
    cozystack.io/target-cluster-name: {{ .Release.Name }}
    sharding.fluxcd.io/key: tenants
spec:
  releaseName: cert-manager
  chartRef:
    kind: ExternalArtifact
    name: cozystack-kubernetes-application-kubevirt-kubernetes-cert-manager
    namespace: cozy-system
  kubeConfig:
    secretRef:
      name: {{ .Release.Name }}-admin-kubeconfig
      key: super-admin.svc
  targetNamespace: cozy-cert-manager
  storageNamespace: cozy-cert-manager
  interval: 5m
  timeout: 20m
  install:
    createNamespace: true
    remediation:
      retries: -1
  upgrade:
    force: true
    remediation:
      retries: -1
  uninstall:
    timeout: 2m
  values:
    # Cozystack's cozy-cert-manager chart defaults crds.enabled to false
    # because the platform itself installs CRDs as a separate HR. For
    # workload clusters there's no such separate CRD HR, so the cert-manager
    # chart must bundle them — otherwise startupapicheck loops on missing
    # CertificateRequest CRD and the controller can't function.
    crds:
      enabled: true
    {{- with .Values.addons.certManager.valuesOverride }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  dependsOn:
  - name: {{ .Release.Name }}-cilium
    namespace: {{ .Release.Namespace }}
{{- end }}
