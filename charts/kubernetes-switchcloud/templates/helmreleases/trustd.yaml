{{- if and .Values.addons.trustd.enabled .Values._namespace.etcd }}
{{- $host := .Values._namespace.host }}
{{- $clusterHostname := .Values.host | default (printf "%s.%s" .Release.Name $host) }}
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: OCIRepository
metadata:
  name: {{ .Release.Name }}-trustd
  namespace: {{ .Release.Namespace }}
  labels:
    cozystack.io/target-cluster-name: {{ .Release.Name }}
spec:
  interval: 5m
  url: {{ .Values.addons.trustd.chartURL }}
  ref:
    tag: {{ .Values.addons.trustd.chartVersion }}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .Release.Name }}-trustd
  labels:
    cozystack.io/target-cluster-name: {{ .Release.Name }}
    sharding.fluxcd.io/key: tenants
spec:
  releaseName: {{ .Release.Name }}-csr-signer
  chartRef:
    kind: OCIRepository
    name: {{ .Release.Name }}-trustd
    namespace: {{ .Release.Namespace }}
  targetNamespace: {{ .Release.Namespace }}
  storageNamespace: {{ .Release.Namespace }}
  interval: 5m
  timeout: 5m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  values:
    clusterHostname: {{ $clusterHostname }}
    talosBundleSecret: {{ .Release.Name }}-talos
    workloadKubeconfigSecret: {{ .Release.Name }}-kubeconfig
    {{- with .Values.addons.trustd.networkPolicy.allowCIDRs }}
    networkPolicy:
      enabled: true
      allowCIDRs:
        {{- toYaml . | nindent 8 }}
    {{- end }}
  {{- if lookup "helm.toolkit.fluxcd.io/v2" "HelmRelease" .Release.Namespace .Release.Name }}
  dependsOn:
  - name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
  {{- end }}
{{- end }}
