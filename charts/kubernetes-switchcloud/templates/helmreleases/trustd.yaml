{{- if .Values._namespace.etcd }}
{{- $host := .Values._namespace.host }}
{{- $clusterHostname := .Values.host | default (printf "%s.%s" .Release.Name $host) }}
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: OCIRepository
metadata:
  name: {{ .Release.Name }}-trustd
  namespace: {{ .Release.Namespace }}
  labels:
    cozystack.io/target-cluster-name: {{ .Release.Name }}
spec:
  interval: 5m
  url: {{ index .Chart.Annotations "talos-csr-signer/chart-url" }}
  ref:
    tag: {{ index .Chart.Annotations "talos-csr-signer/chart-version" }}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .Release.Name }}-trustd
  labels:
    cozystack.io/target-cluster-name: {{ .Release.Name }}
    sharding.fluxcd.io/key: tenants
spec:
  releaseName: {{ .Release.Name }}-trustd
  chartRef:
    kind: OCIRepository
    name: {{ .Release.Name }}-trustd
    namespace: {{ .Release.Namespace }}
  targetNamespace: {{ .Release.Namespace }}
  storageNamespace: {{ .Release.Namespace }}
  interval: 5m
  timeout: 5m
  install:
    # The Deployment mounts Talos bundle + workload kubeconfig Secrets,
    # which CABPT/Kamaji create asynchronously. If Helm waits for the
    # Pod to become Ready, install times out (5m) while volume mount
    # waits on the not-yet-existing Secret. Skip the wait — the Pod
    # rolls forward on its own once the Secret appears, and the VM
    # boot retries trustd indefinitely so there's no need to block the
    # rest of the umbrella chart install on this.
    disableWait: true
    remediation:
      retries: -1
  upgrade:
    disableWait: true
    remediation:
      retries: -1
  values:
    clusterHostname: {{ $clusterHostname }}
    talosBundleSecret: {{ .Release.Name }}-talos
    workloadKubeconfigSecret: {{ .Release.Name }}-kubeconfig
    {{- with .Values.addons.trustd.networkPolicy.allowCIDRs }}
    networkPolicy:
      enabled: true
      allowCIDRs:
        {{- toYaml . | nindent 8 }}
    {{- end }}
{{- end }}
