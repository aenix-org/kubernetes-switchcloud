{{- if and .Values.addons.providerIdSetter.enabled .Values._namespace.etcd }}
{{- $host := .Values._namespace.host }}
{{- $apiServer := printf "https://%s:443" (.Values.host | default (printf "%s.%s" .Release.Name $host)) }}
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: OCIRepository
metadata:
  name: {{ .Release.Name }}-provider-id-setter
  namespace: {{ .Release.Namespace }}
  labels:
    cozystack.io/target-cluster-name: {{ .Release.Name }}
spec:
  interval: 5m
  url: {{ .Values.addons.providerIdSetter.chartURL }}
  ref:
    tag: {{ .Values.addons.providerIdSetter.chartVersion }}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .Release.Name }}-provider-id-setter
  labels:
    cozystack.io/target-cluster-name: {{ .Release.Name }}
    sharding.fluxcd.io/key: tenants
spec:
  releaseName: provider-id-setter
  chartRef:
    kind: OCIRepository
    name: {{ .Release.Name }}-provider-id-setter
    namespace: {{ .Release.Namespace }}
  kubeConfig:
    secretRef:
      name: {{ .Release.Name }}-admin-kubeconfig
      key: super-admin.svc
  targetNamespace: kube-system
  storageNamespace: kube-system
  interval: 5m
  timeout: 5m
  install:
    createNamespace: false
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  values:
    apiServerOverride: {{ $apiServer }}
    {{- toYaml .Values.addons.providerIdSetter.valuesOverride | nindent 4 }}
  {{- if lookup "helm.toolkit.fluxcd.io/v2" "HelmRelease" .Release.Namespace .Release.Name }}
  dependsOn:
  - name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
  {{- end }}
{{- end }}
