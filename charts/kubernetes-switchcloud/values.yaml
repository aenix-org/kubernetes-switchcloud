## @section OpenStack credentials
openstack:
  ## @param openstack.authURL OpenStack identity endpoint
  authURL: ""
  ## @param openstack.regionName OpenStack region
  regionName: ""
  ## @param openstack.applicationCredentialID Application credential ID
  applicationCredentialID: ""
  ## @param openstack.applicationCredentialSecret Application credential secret
  applicationCredentialSecret: ""
  ## @param openstack.cloudName Cloud name used as key in clouds.yaml
  cloudName: "openstack"
  ## @param openstack.existingSecret Name of existing Secret with clouds.yaml key (overrides inline credentials)
  existingSecret: ""
  ## @param openstack.floatingIPNetwork Name of the external network for Floating IPs (leave empty to disable FIPs — outbound internet works via SNAT)
  floatingIPNetwork: ""

## @section Network
  ## @param openstack.network.id OpenStack network ID for worker nodes (legacy mode — pre-existing Neutron network). Leave empty to enable auto-managed mode: CAPO creates a dedicated network/subnet/router per cluster on apply and deletes them on cluster delete, giving per-cluster L2/L3 isolation.
  ## @param openstack.network.subnetCIDR IPv4 CIDR for the auto-managed worker subnet. Used only when openstack.network.id is empty.
  ## @param openstack.network.externalNetworkID Neutron network ID used as the router's external gateway in auto-managed mode. Leave empty to let CAPO auto-discover the single project-visible external network.
  ## @param openstack.network.dnsNameservers DNS servers wired into the auto-managed subnet's DHCP. Used only in auto-managed mode.
  network:
    id: ""
    subnetCIDR: "10.244.0.0/24"
    externalNetworkID: ""
    dnsNameservers: []

## @section Kubernetes version
## @param version Kubernetes version string (e.g. v1.32.6)
version: "v1.32.6"

## @param talosVersion Talos OS version embedded in the node image
talosVersion: "v1.10.0"

## @section Control plane
controlPlane:
  ## @param controlPlane.replicas Number of Kamaji control plane replicas
  replicas: 2
  apiServer:
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        memory: 2Gi
  controllerManager:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
  scheduler:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi

## @section Kubernetes API endpoint (optional override)
## When empty the chart uses the default <release>.<namespace>.svc:6443
host: ""

## @section Ingress
## @param ingressClassName IngressClass for the Kamaji-managed apiserver Ingress. When empty (default), falls back to `_namespace.ingress` (= the parent tenant namespace name) so per-tenant Ingress controllers like `tenant-root` keep working unchanged. Set to e.g. `nginx` to route the apiserver through a host-level ingress controller instead.
ingressClassName: ""

## @section Cluster network CIDRs
## Pod, service and CoreDNS CIDRs that the tenant cluster bootstraps with.
## These map onto CAPI Cluster.spec.clusterNetwork.{pods,services}.cidrBlocks
## and onto the CoreDNS Service clusterIP. They are immutable after the
## cluster is created (CAPI rejects clusterNetwork updates), so set them at
## install time. The dnsClusterIP must fall inside serviceCIDR.
network:
  ## @param network.podCIDR CIDR allocated for pods (CAPI Cluster.spec.clusterNetwork.pods)
  podCIDR: "10.243.0.0/16"
  ## @param network.serviceCIDR CIDR allocated for Services (CAPI Cluster.spec.clusterNetwork.services)
  serviceCIDR: "10.95.0.0/16"
  ## @param network.dnsClusterIP ClusterIP for the CoreDNS Service (must be inside serviceCIDR)
  dnsClusterIP: "10.95.0.10"

## @section Node groups
## @param nodeGroups Worker node group definitions
nodeGroups:
  md0:
    ## @param nodeGroups.md0.minReplicas Minimum autoscaler replicas
    minReplicas: 0
    ## @param nodeGroups.md0.maxReplicas Maximum autoscaler replicas
    maxReplicas: 10
    ## @param nodeGroups.md0.flavorName OpenStack Nova flavor name
    flavorName: "c004r008"
    ## @param nodeGroups.md0.imageName Glance image name for Talos nodes
    imageName: "talos-openstack-amd64"
    ## @param nodeGroups.md0.roles Node roles propagated as labels
    roles: []
    ## @param nodeGroups.md0.resources Node CPU/memory (used for kubelet reservations and autoscaler capacity hints)
    resources:
      cpu: 4
      memory: 8Gi
    ## @param nodeGroups.md0.kubelet Kubelet reservation overrides
    kubelet:
      evictionHardMemory: "7%"
      evictionSoftMemory: "10%"
    ## @param nodeGroups.md0.rootVolume Boot volume for flavors with zero local disk (required on Switch Cloud)
    rootVolume:
      sizeGiB: 50
    ## @param nodeGroups.md0.securityGroups OpenStack security groups
    securityGroups:
      - default

## @section Addons
addons:
  certManager:
    enabled: true
    valuesOverride: {}
  cilium:
    enabled: true
    valuesOverride: {}
  coredns:
    enabled: true
    valuesOverride: {}
  ingressNginx:
    ## @param addons.ingressNginx.enabled Enable Ingress-NGINX controller in the tenant cluster
    enabled: false
    ## @param addons.ingressNginx.exposeMethod How the controller is reachable from outside. Allowed values: `LoadBalancer`, `Proxied`. `Proxied` is reserved for a future platform-side router and currently fails render in switchcloud (no per-tenant SNI routing for HTTP yet).
    exposeMethod: LoadBalancer
    ## @param addons.ingressNginx.hosts Domains served by this tenant ingress. Used for cert-manager SANs and to document the public routing target.
    hosts: []
    valuesOverride: {}
  metricsServer:
    enabled: true
    valuesOverride: {}
  fluxcd:
    enabled: false
    valuesOverride: {}
  kilo:
    ## @param addons.kilo.enabled Install Kilo WireGuard mesh in the tenant cluster. Required if the cluster should mesh with peers across locations or via the kilo-clustermesh-operator. Defaults to false because not every tenant needs cross-location routing, and a dedicated mesh-leader node must be pinned with `cluster-autoscaler.kubernetes.io/scale-down-disabled=true` to avoid losing the gateway during a scale-down event.
    enabled: false
    valuesOverride: {}
    ## @section ClusterMesh registration
    ## When clusterMesh.remoteClusters has at least one entry, the chart
    ## emits a kilo.squat.ai/v1alpha1 ClusterMesh resource in the same
    ## namespace as the tenant Kamaji secrets (`tenant-root`). The
    ## kilo-clustermesh-operator running in the management cluster
    ## reconciles it. The local cluster entry is auto-derived from this
    ## release's name and the Kamaji-generated admin kubeconfig Secret
    ## (`<release>-admin-kubeconfig`, key `super-admin.conf`). Remote
    ## clusters are operator-supplied by Secret name so the same Secret
    ## naming convention from sibling switchcloud tenants can be reused.
    clusterMesh:
      ## @param addons.kilo.clusterMesh.localWireguardCIDR WireGuard CIDR for the local cluster (must match kilo.transitCIDR override)
      localWireguardCIDR: ""
      ## @param addons.kilo.clusterMesh.wireguardPort UDP port for WireGuard peers
      wireguardPort: 51820
      ## @param addons.kilo.clusterMesh.remoteClusters Remote clusters to mesh with. Each entry: {name, kubeconfigSecretName, podCIDRs, serviceCIDR, wireguardCIDR}.
      remoteClusters: []
      ## @param addons.kilo.clusterMesh.localCluster Management cluster added as local:true peer (operator uses in-cluster credentials, no Secret needed). Fields: {name, podCIDRs[], serviceCIDR, wireguardCIDR, wireguardPort, additionalCIDRs[]}.
      localCluster: {}
  ## @section tenantApiserverProxy (per-node TLS SNI injector for kubernetes.default.svc ClusterIP)
  tenantApiserverProxy:
    enabled: true
    valuesOverride: {}
  ## @section trustd (always enabled — required for Talos worker bootstrap)
  trustd:
    ## @param addons.trustd.networkPolicy.allowCIDRs Source CIDRs allowed to reach the signer (VM networks)
    networkPolicy:
      allowCIDRs: []

## @section Internal (injected by cozystack-api)
_namespace:
  etcd: ""
  ingress: ""
  host: ""
