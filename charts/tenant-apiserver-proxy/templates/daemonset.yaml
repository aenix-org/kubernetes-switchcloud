{{- if not .Values.upstream }}
{{- fail "upstream is required" }}
{{- end }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tenant-apiserver-proxy
  namespace: kube-system
  labels:
    app: tenant-apiserver-proxy
spec:
  selector:
    matchLabels:
      app: tenant-apiserver-proxy
  template:
    metadata:
      labels:
        app: tenant-apiserver-proxy
    spec:
      # See templates/rbac.yaml for why this is a long-lived SA instead
      # of a Helm post-install hook resource. Scoped tightly: a Role in
      # `default` namespace with `services` get/patch on resourceNames
      # [kubernetes], nothing else.
      serviceAccountName: tenant-apiserver-proxy
      hostNetwork: true
      # Default makes the pod use the node's resolv.conf so the proxy can
      # resolve the upstream hostname through Talos NodeDNS even when the
      # in-cluster CoreDNS is not yet ready (which is exactly the case this
      # proxy exists to unbreak).
      dnsPolicy: Default
      tolerations:
      - operator: Exists
      priorityClassName: system-node-critical
      # The proxy must come up before the rest of the cluster can talk to
      # kubernetes.default.svc, so we run on every node including
      # not-ready/uninitialised ones.
      #
      # iptables setup lives in an init container instead of a long-lived
      # sidecar: the DNAT rule is kernel state that survives once
      # installed, so there is nothing for a sidecar to do after the
      # initial setup. Running it once at pod start and exiting keeps
      # NET_ADMIN scoped to the boot phase, drops the `sleep infinity`
      # busy-wait, and lets the main proxy container stay unprivileged.
      initContainers:
      - name: install-dnat
        image: registry.k8s.io/build-image/debian-iptables:bookworm-v1.0.0
        # privileged is required to write route_localnet to /proc/sys/net/...
        # which is read-only under runc's default masked paths. The CNI
        # (Cilium / kube-proxy) does NOT set this sysctl in our setup, so we
        # have to set it ourselves. Scope is limited to the init phase: the
        # container exits as soon as the DNAT rule is installed.
        securityContext:
          privileged: true
          capabilities:
            add: [NET_ADMIN]
        command:
        - sh
        - -c
        - |
          set -ex
          # Allow routing of traffic that hits DNAT-rewritten 127.0.0.1
          # from non-loopback interfaces (the same sysctl kube-proxy sets).
          # Written via /proc to avoid pulling in procps.
          echo 1 > /proc/sys/net/ipv4/conf/all/route_localnet
          CHAIN=TENANT_APISERVER_PROXY
          iptables-nft -t nat -N $CHAIN 2>/dev/null || true
          iptables-nft -t nat -F $CHAIN
          iptables-nft -t nat -A $CHAIN -d {{ .Values.kubernetesServiceIP }}/32 -p tcp --dport {{ .Values.kubernetesServicePort }} -j DNAT --to-destination 127.0.0.1:{{ .Values.proxyPort }}
          iptables-nft -t nat -C OUTPUT -j $CHAIN 2>/dev/null || iptables-nft -t nat -I OUTPUT 1 -j $CHAIN
          iptables-nft -t nat -C PREROUTING -j $CHAIN 2>/dev/null || iptables-nft -t nat -I PREROUTING 1 -j $CHAIN
          echo "DNAT installed for {{ .Values.kubernetesServiceIP }}:{{ .Values.kubernetesServicePort }} -> 127.0.0.1:{{ .Values.proxyPort }}"
      # Mark default/kubernetes with service-proxy-name so kube-proxy /
      # Cilium stop programming its ClusterIP redirect — after this the
      # OUTPUT/PREROUTING DNAT installed above is the only thing
      # steering traffic for that ClusterIP, which is the whole point
      # of this DaemonSet.
      #
      # PATCH is idempotent in Kubernetes (no-op when the label already
      # matches), so concurrent runs across every DS pod on every node
      # are safe and converge on the same end state. Reaches the
      # apiserver through its public hostname via Node DNS, not via the
      # in-cluster Service ClusterIP — that ClusterIP is exactly what
      # this DaemonSet exists to repair, so we cannot depend on it
      # working here.
      #
      # Re-runs on every pod start, which means the label is also
      # restored within seconds if anything ever strips it (operator
      # change, helm rollback to an empty release, kubectl edit).
      - name: ensure-service-proxy-name
        image: curlimages/curl:8.10.1
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
        command:
        - sh
        - -c
        - |
          set -eu
          TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          HOST="{{ .Values.apiserverHostname | default (regexReplaceAll ":\\d+$" .Values.upstream "") }}"
          PORT="{{ .Values.apiserverPort | default 443 }}"
          # --fail-with-body so non-2xx returns a non-zero exit and the
          # init container retries (which is the desired self-healing
          # behaviour — kubelet will rerun this until success).
          curl --silent --show-error --fail-with-body \
            --cacert "$CA" \
            --header "Authorization: Bearer $TOKEN" \
            --header "Content-Type: application/strategic-merge-patch+json" \
            --request PATCH \
            --data '{"metadata":{"labels":{"service.kubernetes.io/service-proxy-name":"{{ .Values.serviceProxyName }}"}}}' \
            "https://${HOST}:${PORT}/api/v1/namespaces/default/services/kubernetes" \
            --output /dev/null --write-out 'http=%{http_code}\n'
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 32Mi
      containers:
      - name: proxy
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        - --listen=127.0.0.1:{{ .Values.proxyPort }}
        - --upstream={{ .Values.upstream }}
        - --cert=/etc/tenant-apiserver-proxy/tls.crt
        - --key=/etc/tenant-apiserver-proxy/tls.key
        - --ca=/etc/tenant-apiserver-proxy/ca.crt
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        readinessProbe:
          tcpSocket:
            port: {{ .Values.proxyPort }}
            host: 127.0.0.1
          initialDelaySeconds: 3
          periodSeconds: 10
        volumeMounts:
        - name: tls
          mountPath: /etc/tenant-apiserver-proxy
          readOnly: true
      volumes:
      - name: tls
        secret:
          secretName: tenant-apiserver-proxy-tls
          items:
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
          - key: ca.crt
            path: ca.crt
