apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenant-apiserver-proxy-labeler
  namespace: kube-system
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tenant-apiserver-proxy-labeler
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
rules:
- apiGroups: [""]
  resources: [services]
  verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tenant-apiserver-proxy-labeler
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tenant-apiserver-proxy-labeler
subjects:
- kind: ServiceAccount
  name: tenant-apiserver-proxy-labeler
  namespace: kube-system
---
# Marks default/kubernetes with service-proxy-name so kube-proxy / Cilium
# stop programming its ClusterIP redirect. After this, the iptables OUTPUT
# DNAT rule installed by the DaemonSet is the one that actually steers
# traffic for that ClusterIP.
apiVersion: batch/v1
kind: Job
metadata:
  name: tenant-apiserver-proxy-label-kubernetes-svc
  namespace: kube-system
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: tenant-apiserver-proxy-labeler
      restartPolicy: OnFailure
      # hostNetwork so we can reach the apiserver via its public hostname through
      # the node's resolver instead of via the in-cluster Service ClusterIP, which
      # is what this label is trying to unbreak.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: labeler
        image: curlimages/curl:8.10.1
        command:
        - sh
        - -c
        - |
          set -e
          TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          curl -sS --cacert $CA -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/strategic-merge-patch+json" \
            -X PATCH \
            --data '{"metadata":{"labels":{"service.kubernetes.io/service-proxy-name":"{{ .Values.serviceProxyName }}"}}}' \
            "https://{{ .Values.apiserverHostname | default (regexReplaceAll ":\\d+$" .Values.upstream "") }}:{{ .Values.apiserverPort | default 443 }}/api/v1/namespaces/default/services/kubernetes" \
            -o /dev/null -w 'http=%{http_code}\n'
