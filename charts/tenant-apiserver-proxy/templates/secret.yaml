{{- if not (and .Values.tls.cert .Values.tls.key .Values.tls.ca) }}
{{- fail "tls.cert, tls.key and tls.ca are required (PEM-encoded). The parent chart should provide these via helm lookup of the Kamaji cluster CA and apiserver Secrets." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: tenant-apiserver-proxy-tls
  namespace: kube-system
  labels:
    app: tenant-apiserver-proxy
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.tls.cert | b64enc | quote }}
  tls.key: {{ .Values.tls.key | b64enc | quote }}
  ca.crt: {{ .Values.tls.ca | b64enc | quote }}
