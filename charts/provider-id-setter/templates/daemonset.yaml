apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: switchcloud-provider-id-setter
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: switchcloud-provider-id-setter
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: switchcloud-provider-id-setter
    spec:
      serviceAccountName: switchcloud-provider-id-setter
      hostNetwork: true
      tolerations:
        - operator: Exists
      priorityClassName: system-node-critical
      initContainers:
        - name: set-provider-id
          image: {{ .Values.image }}
          command: ["/provider-id-setter"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- if .Values.apiServerOverride }}
            - name: KUBERNETES_API_SERVER_OVERRIDE
              value: {{ .Values.apiServerOverride | quote }}
            {{- end }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
