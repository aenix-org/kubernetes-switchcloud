apiVersion: v1
kind: ServiceAccount
metadata:
  name: switchcloud-provider-id-setter
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: switchcloud-provider-id-setter
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: switchcloud-provider-id-setter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: switchcloud-provider-id-setter
subjects:
  - kind: ServiceAccount
    name: switchcloud-provider-id-setter
    namespace: kube-system
