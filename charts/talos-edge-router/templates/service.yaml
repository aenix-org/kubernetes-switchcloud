{{- /*
One Service per listener so each carries its own externalIPs and own
externalTrafficPolicy. externalTrafficPolicy=Local pins traffic to the node
that already hosts the matching DaemonSet pod — no SNAT, real source IP
preserved, return path symmetric. Combined with per-node DaemonSet pods,
this keeps long-lived bidirectional streams alive.
*/}}
{{- range .Values.listeners }}
---
apiVersion: v1
kind: Service
metadata:
  name: talos-edge-router-{{ .name }}
  labels:
    app: talos-edge-router
    app.kubernetes.io/component: {{ .name }}
spec:
  type: ClusterIP
  externalTrafficPolicy: Local
  selector:
    app: talos-edge-router
    app.kubernetes.io/component: {{ .name }}
  ports:
  - name: {{ .name }}
    port: {{ .port }}
    targetPort: {{ .name }}
    protocol: TCP
{{- end }}
