apiVersion: apps/v1
kind: Deployment
metadata:
  name: talos-edge-router
  labels:
    app: talos-edge-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: talos-edge-router
  template:
    metadata:
      labels:
        app: talos-edge-router
    spec:
      serviceAccountName: talos-edge-router
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: router
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        {{- range .Values.listeners }}
        - --listener={{ .name }}:{{ .port }}:{{ .label }}{{- if .targetPort }}:{{ .targetPort }}{{- end }}
        {{- end }}
        - --sync-namespace=$(POD_NAMESPACE)
        - --sync-service=talos-edge-router
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        ports:
        {{- range .Values.listeners }}
        - name: {{ .name }}
          containerPort: {{ .port }}
          protocol: TCP
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        readinessProbe:
          tcpSocket:
            port: {{ (index .Values.listeners 0).port }}
          initialDelaySeconds: 3
          periodSeconds: 10
