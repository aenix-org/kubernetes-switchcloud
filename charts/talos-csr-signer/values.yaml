image:
  repository: ghcr.io/aenix-org/talos-csr-signer
  tag: ""  # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# clusterHostname is the FQDN of the cluster's API endpoint.
# The trustd-router uses this to match incoming SNI to this signer.
# Example: kubernetes-switchcloud-sc-test.dev3.infra.aenix.org
clusterHostname: ""

# talosBundleSecret is the name of the Secret containing the Talos secrets bundle.
# Must be in the same namespace. Key inside the Secret must be "bundle".
talosBundleSecret: ""

# workloadKubeconfigSecret is the name of the Secret containing the workload cluster
# kubeconfig (CAPI cluster.x-k8s.io/secret type, key "value"). When set, talos-csr-signer
# creates the bootstrap-token-* Secret in kube-system of the workload cluster on startup,
# enabling Talos workers to authenticate against a Kamaji-hosted control plane.
workloadKubeconfigSecret: ""

# networkPolicy controls ingress restrictions on port 50001.
networkPolicy:
  enabled: true
  # allowCIDRs restricts which source CIDRs may reach the signer.
  # Set to Switch Cloud VM network ranges.
  allowCIDRs: []
  # - 10.0.0.0/8

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi
