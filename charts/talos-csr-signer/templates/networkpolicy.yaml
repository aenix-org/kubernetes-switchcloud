{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-csr-signer
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-csr-signer
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - port: 50001
      protocol: TCP
    {{- if .Values.networkPolicy.allowCIDRs }}
    from:
    {{- range .Values.networkPolicy.allowCIDRs }}
    - ipBlock:
        cidr: {{ . }}
    {{- end }}
    # also allow from talos-trustd-router pod (in-cluster)
    - podSelector:
        matchLabels:
          app: talos-trustd-router
    {{- else }}
    # No allowCIDRs configured — allow only from talos-trustd-router.
    from:
    - podSelector:
        matchLabels:
          app: talos-trustd-router
    {{- end }}
{{- end }}
