{{- if .Values.kilo.nodeAnnotator.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kilo-node-annotator
  namespace: cozy-kilo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kilo-node-annotator
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kilo-node-annotator
subjects:
  - kind: ServiceAccount
    name: kilo-node-annotator
    namespace: cozy-kilo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kilo-node-annotator
---
# DaemonSet that sets kilo.squat.ai/force-endpoint=<InternalIP>:<port> on
# every node, looped every 60s so the annotation tracks status.hostIP
# across NIC reassignments. Required for kilo-clustermesh-operator to
# issue WireGuard peer endpoints in environments without a
# NodeExternalIP (OpenStack tenants without floating IPs is the
# canonical case). Runs on the pod network (no hostNetwork) and as a
# non-root user; the only privilege it needs is the namespaced RBAC
# below to patch Nodes.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kilo-node-annotator
  namespace: cozy-kilo
  labels:
    app.kubernetes.io/name: kilo-node-annotator
    app.kubernetes.io/part-of: kilo
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kilo-node-annotator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kilo-node-annotator
    spec:
      serviceAccountName: kilo-node-annotator
      tolerations:
        - operator: Exists
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: annotator
          image: {{ .Values.kilo.nodeAnnotator.image | quote }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: PORT
              value: {{ .Values.kilo.nodeAnnotator.port | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          command:
            - /bin/sh
            - -c
            - |
              # Resync every 60s. '|| true' keeps the pod alive across
              # transient apiserver hiccups; next iteration retries.
              while true; do
                kubectl annotate node "$NODE_NAME" "kilo.squat.ai/force-endpoint=${NODE_IP}:${PORT}" --overwrite || true
                sleep 60
              done
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 50m, memory: 64Mi}
{{- end }}
