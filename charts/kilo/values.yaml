kilo:
  image:
    pullPolicy: IfNotPresent
    tag: latest@sha256:016d054fcbb31d77ecfc8a0e7ead9f8cc01fb2f5a12b619d4fb0b7d745414df0
    repository: ghcr.io/cozystack/cozystack/kilo
  transitCIDR: 100.66.0.0/16
  meshGranularity: location
  # Kilo encapsulate mode: 'never' | 'crosssubnet' | 'always'.
  # crosssubnet (default) skips the WG tunnel when peers are in the same
  # underlay subnet, which breaks cross-cluster pod routing when the
  # mesh peers live in the same OpenStack network but different pod CIDRs.
  # Set to 'always' for cluster-mesh deployments.
  encapsulate: crosssubnet
  # When the tenant has no NodeExternalIP (typical for OpenStack tenants
  # without floating IPs), kilo-clustermesh-operator cannot derive a
  # WireGuard endpoint and skips the node with NodeNoEndpoint. Run a
  # tiny privileged DaemonSet that patches each node with
  # kilo.squat.ai/force-endpoint=<status.hostIP>:<wireguardPort> so both
  # the operator and Kilo itself pick the right peer endpoint.
  nodeAnnotator:
    enabled: false
    port: 51820
    # alpine/k8s ships kubectl plus a busybox /bin/sh — the rancher/kubectl
    # image is distroless and does not have a shell, which makes the
    # annotation loop "exec: /bin/sh: no such file or directory".
    image: alpine/k8s:1.32.6@sha256:b965c518d72d817e3c9eee24a357bd68b005ce7bd3504eb8f2b1b3dc839a1624
  cleanUpInterface: false
  mtu: auto
  # Cilium is the CNI in switchcloud tenant clusters; Kilo must run in
  # compatibility mode so it does not fight Cilium for the dataplane and
  # only handles WireGuard tunnels between locations.
  compatibility: cilium
