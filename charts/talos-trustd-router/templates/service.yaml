apiVersion: v1
kind: Service
metadata:
  name: talos-trustd-router
spec:
  selector:
    app: talos-trustd-router
  ports:
  - name: trustd
    port: 50001
    targetPort: trustd
    protocol: TCP
  {{- if .Values.externalIPs }}
  externalIPs:
    {{- toYaml .Values.externalIPs | nindent 4 }}
  {{- end }}
